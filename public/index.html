      <div class="linha-titulo" style="margin-top:1.5rem"><h2>Lembretes de amanhã ${lembrar.length ? `(${lembrar.length})` : ''}</h2></div>
      <p class="suave">Toque em "Lembrar" para abrir o WhatsApp com a mensagem pronta.</p>
      ${lembrar.length ? lembrar.map((a) => `
        <div class="cartao item linha-lembrete">
          <div><strong>${esc(fmt.hora(a.inicio))}</strong> · ${esc(a.cliente?.nome)}
            <span class="suave" style="display:block">${esc(servicosTexto(a))}</span></div>
          ${linkZapCliente(a, 'lembrete') ? `<a class="botao secundario pequeno" target="_blank" rel="noopener"
            href="${esc(linkZapCliente(a, 'lembrete'))}">${ICONE_ZAP} Lembrar</a>` : ''}
        </div>`).join('') : '<p class="cartao suave">Nenhum horário confirmado para amanhã.</p>'}

`;
    ligarAgendamentos($c, pedidos, () => telaPainel('pedidos'));

  }

  // --- ABA: AGENDA (um dia por vez)
  async function abaAgenda($c, resto, params) {
    const dia = params.get('dia') && /^\d{4}-\d{2}-\d{2}$/.test(params.get('dia')) ? params.get('dia') : hojeNoSalao();
    const hoje = hojeNoSalao();
    const [lista, semana] = await Promise.all([
      painelApi(`/agendamentos?de=${dia}&ate=${dia}`),
      painelApi(`/agendamentos?de=${hoje}&ate=${somarDias(hoje, 6)}&status=agendado`),
    ]);
    const irPara = (d) => { location.hash = `#/painel/agenda?dia=${d}`; };
    // Texto da agenda da semana para mandar para o próprio WhatsApp
    const porDia = {};
    semana.forEach((a) => { (porDia[dataNoFuso(a.inicio)] ??= []).push(a); });
    const textoSemana = `📅 Agenda da semana — ${cfgPainel?.nome_salao ?? 'Lucy Cabeleireira'}\n\n` + (Object.keys(porDia).length
      ? Object.entries(porDia).map(([d, itens]) => `*${fmt.partesDoDia(d).longa}*\n` + itens.map((a) =>
          `• ${fmt.hora(a.inicio)}–${fmt.hora(a.fim)} · ${a.cliente?.nome} · ${servicosTexto(a)}`).join('\n')).join('\n\n')
      : 'Nenhum horário confirmado nos próximos 7 dias.');
    const linkSemana = cfgPainel?.whatsapp_lucy ? zapCom(cfgPainel.whatsapp_lucy, textoSemana) : null;
    $c.innerHTML = `
      <div class="navegar-dia">
        <button class="secundario pequeno" id="ant" aria-label="Dia anterior">◀</button>
        <input type="date" id="dia" value="${esc(dia)}" aria-label="Escolher dia">
        <button class="secundario pequeno" id="prox" aria-label="Próximo dia">▶</button>
        ${dia !== hojeNoSalao() ? '<button class="secundario pequeno" id="hoje">Hoje</button>' : ''}
      </div>
      <div class="linha-titulo"><h2>${esc(fmt.partesDoDia(dia).longa)}</h2><button class="pequeno" id="marcar">+ Marcar horário</button></div>
      <p class="suave" style="margin-top:0">${linkSemana
        ? `<a href="${esc(linkSemana)}" target="_blank" rel="noopener">${ICONE_ZAP} Mandar a agenda da semana para o meu WhatsApp</a> (${semana.length} horário${semana.length === 1 ? '' : 's'})`
        : 'Para receber a agenda da semana no seu WhatsApp, preencha o WhatsApp do salão na aba <a href="#/painel/salao">Salão</a>.'}</p>
      <div id="form-novo"></div>
      ${lista.length ? lista.map((a) => cartaoAgendamento(a)).join('') : '<p class="cartao suave">Nenhum horário neste dia.</p>'}`;
    document.getElementById('ant').onclick = () => irPara(somarDias(dia, -1));
    document.getElementById('prox').onclick = () => irPara(somarDias(dia, 1));
    document.getElementById('hoje')?.addEventListener('click', () => irPara(hojeNoSalao()));
    document.getElementById('dia').onchange = (e) => e.target.value && irPara(e.target.value);
    const recarregar = (d = dia) => (d === dia ? telaPainel('agenda', new URLSearchParams({ dia })) : irPara(d));
    document.getElementById('marcar').onclick = () => formularioAgendamento(document.getElementById('form-novo'), null, recarregar, { dia });
    ligarAgendamentos($c, lista, recarregar);
    if (resto[0] === 'novo') formularioAgendamento(document.getElementById('form-novo'), null, recarregar, {
      dia, cliente: params.get('cliente'), retorno_de: params.get('retorno_de'),
      servicos: (params.get('servicos') ?? '').split(',').filter(Boolean),
    });
  }

  // --- ABA: CLIENTES (lista + ficha)
  const CAMPOS_CLIENTE = [
    { nome: 'nome', rotulo: 'Nome', obrigatorio: true, max: 80 },

  async function abaClientes($c, resto) {
    if (resto[0]) return fichaCliente($c, resto[0]);
    const todos = await painelApi('/clientes');
    $c.innerHTML = `
      <div class="linha-titulo"><h2>Clientes (${todos.length})</h2><button class="pequeno" id="nova">+ Nova cliente</button></div>
      <div id="form-cliente"></div>
      <label for="busca" class="sr">Buscar cliente</label>
      <input id="busca" type="search" placeholder="Buscar por nome ou WhatsApp" autocomplete="off">
      <div id="lista-clientes" class="lista-simples"></div>`;
    const $lista = document.getElementById('lista-clientes');
    const desenhar = (filtro = '') => {
      const f = filtro.toLowerCase(), n = filtro.replace(/\D/g, '');
      const lista = todos.filter((c) => !f || c.nome.toLowerCase().includes(f) || (n.length >= 3 && c.whatsapp.includes(n)));
      $lista.innerHTML = lista.length ? lista.map((c) => `
        <a class="cartao item-link" href="#/painel/clientes/${esc(c.id)}">
          <strong>${esc(c.nome)}</strong><span class="suave">${esc(zapBonito(c.whatsapp))}</span></a>`).join('')
        : `<p class="suave">${todos.length ? 'Ninguém encontrado.' : 'Nenhuma cliente cadastrada ainda.'}</p>`;
    };
    document.getElementById('busca').oninput = (e) => desenhar(e.target.value);
    document.getElementById('nova').onclick = () => {
      const $f = document.getElementById('form-cliente');
      $f.innerHTML = `<form class="cartao form-cartao" novalidate><h2>Nova cliente</h2>${htmlCampos(CAMPOS_CLIENTE, {}, 'cl')}
        <p class="mensagem erro msg-form" role="alert"></p>
        <div class="acoes"><button type="button" class="secundario" data-cancelar>Cancelar</button><button type="submit">Salvar</button></div></form>`;
      const form = $f.querySelector('form');
      form.querySelector('[data-cancelar]').onclick = () => { $f.innerHTML = ''; };
      form.onsubmit = (ev) => {
        ev.preventDefault();
        enviarFormulario(form, async () => {
          const nova = await painelApi('/clientes', { metodo: 'POST', corpo: lerCampos(form, CAMPOS_CLIENTE) });
          location.hash = `#/painel/clientes/${nova.id}`;

      form.elements.nome.focus();

  async function fichaCliente($c, id) {
    const cl = await painelApi(`/clientes/${encodeURIComponent(id)}`);
    const recarregar = () => telaPainel(`clientes/${id}`);
    const linha = (rotulo, valor) => valor ? `<p><span class="suave">${rotulo}:</span> ${esc(valor)}</p>` : '';
    $c.innerHTML = `
      <button class="voltar" data-voltar="#/painel/clientes">← Voltar para clientes</button>
      <div class="cartao" id="dados">
        <div class="linha-titulo"><h2>${esc(cl.nome)}</h2><button class="secundario pequeno" id="editar">Editar</button></div>
        <p><a href="${linkZap(cl.whatsapp)}" target="_blank" rel="noopener">${esc(zapBonito(cl.whatsapp))}</a>${cl.email ? ' · ' + esc(cl.email) : ''}</p>
        ${cl.alergias ? `<p class="alerta-cliente">Alergias: ${esc(cl.alergias)}</p>` : ''}
        ${cl.necessidades_especificas ? `<p class="alerta-cliente">Necessidades: ${esc(cl.necessidades_especificas)}</p>` : ''}
        ${linha('Nascimento', cl.data_nascimento && fmt.partesDoDia(cl.data_nascimento).longa.replace(/^[^,]+, /, ''))}
        ${cl.observacoes ? `<p style="white-space:pre-line"><span class="suave">Anotações:</span> ${esc(cl.observacoes)}</p>` : ''}
        <div class="acoes-item">
          <a class="botao pequeno" href="#/painel/agenda/novo?cliente=${esc(cl.id)}">Marcar horário</a>
          <button class="perigo pequeno" id="excluir">Excluir cliente</button>
        </div>
      </div>
      <div class="linha-titulo"><h2>Histórico de atendimentos</h2><button class="pequeno" id="novo-hist">+ Adicionar</button></div>
      <div id="form-hist"></div>
      ${cl.historico.length ? cl.historico.map((h) => `
        <div class="cartao item" data-hist="${esc(h.id)}">
          <p class="quando">${esc(fmt.partesDoDia(h.data).longa)}</p>
          ${linha('Serviços', h.servicos_realizados)}${linha('Tintura', h.tintura_utilizada)}${linha('Quantidade', h.tintura_quantidade)}
          ${h.anotacoes ? `<p style="white-space:pre-line">${esc(h.anotacoes)}</p>` : ''}
          <div class="acoes-item"><button class="secundario pequeno" data-acao="editar">Editar</button>
            <button class="perigo pequeno" data-acao="excluir">Excluir</button></div>
        </div>`).join('') : '<p class="suave">Nenhum atendimento anotado ainda.</p>'}
      <h2 style="margin-top:1.5rem">Horários</h2>
      ${cl.agendamentos.length ? cl.agendamentos.map((a) => cartaoAgendamento({ ...a, cliente: cl }, { comData: true, comAcoes: false })).join('')
        : '<p class="suave">Nenhum horário.</p>'}`;

    // Editar a ficha
    document.getElementById('editar').onclick = () => {
      const $d = document.getElementById('dados');
      $d.innerHTML = `<form class="form-cartao" novalidate><h2>Editar ficha</h2>${htmlCampos(CAMPOS_CLIENTE, cl, 'cl')}
        <p class="mensagem erro msg-form" role="alert"></p>
        <div class="acoes"><button type="button" class="secundario" data-cancelar>Cancelar</button><button type="submit">Salvar</button></div></form>`;
      const form = $d.querySelector('form');
      form.querySelector('[data-cancelar]').onclick = recarregar;
      form.onsubmit = (ev) => {
        ev.preventDefault();
        enviarFormulario(form, async () => {
          await painelApi(`/clientes/${cl.id}`, { metodo: 'PATCH', corpo: lerCampos(form, CAMPOS_CLIENTE) });
          await recarregar(); avisar('Ficha atualizada.');
        });
      };
    };

    // Excluir a cliente (e tudo dela)
    document.getElementById('excluir').onclick = async () => {
      const n = cl.agendamentos.length, h = cl.historico.length;
      if (!await perguntar(`Excluir <strong>${esc(cl.nome)}</strong>?<br>Também serão apagados ${n} horário${n === 1 ? '' : 's'}
        e ${h} anotaç${h === 1 ? 'ão' : 'ões'} do histórico. Não dá para desfazer.`, { sim: 'Sim, excluir tudo' })) return;
      await painelApi(`/clientes/${cl.id}`, { metodo: 'DELETE' });
      location.hash = '#/painel/clientes';
    };

    // Histórico: adicionar, editar, excluir
    const formHist = (h) => {
      const $f = h ? $c.querySelector(`[data-hist="${h.id}"]`) : document.getElementById('form-hist');
      $f.innerHTML = `<form class="${h ? '' : 'cartao '}form-cartao" novalidate><h2>${h ? 'Editar atendimento' : 'Novo atendimento'}</h2>
        ${htmlCampos(CAMPOS_HISTORICO, h ?? { data: hojeNoSalao() }, 'hi')}
        <p class="mensagem erro msg-form" role="alert"></p>
        <div class="acoes"><button type="button" class="secundario" data-cancelar>Cancelar</button><button type="submit">Salvar</button></div></form>`;
      const form = $f.querySelector('form');
      form.querySelector('[data-cancelar]').onclick = recarregar;
      form.onsubmit = (ev) => {
        ev.preventDefault();
        enviarFormulario(form, async () => {
          const corpo = lerCampos(form, CAMPOS_HISTORICO);
          if (h) await painelApi(`/historico/${h.id}`, { metodo: 'PATCH', corpo });
          else await painelApi(`/clientes/${cl.id}/historico`, { metodo: 'POST', corpo });
          await recarregar(); avisar(h ? 'Atendimento atualizado.' : 'Atendimento anotado.');
        });
      };
      form.scrollIntoView({ block: 'start' });
    };
    document.getElementById('novo-hist').onclick = () => formHist(null);
    $c.querySelectorAll('[data-hist]').forEach(($h) => {
      const h = cl.historico.find((x) => x.id === $h.dataset.hist);
      $h.querySelector('[data-acao=editar]').onclick = () => formHist(h);
      $h.querySelector('[data-acao=excluir]').onclick = async () => {
        if (!await perguntar(`Excluir a anotação de <strong>${esc(fmt.partesDoDia(h.data).longa)}</strong>?`)) return;
        await painelApi(`/historico/${h.id}`, { metodo: 'DELETE' });
        await recarregar(); avisar('Anotação excluída.');
      };
    });
  }

  async function abaHorarios($c) {

    $c.innerHTML = `
      <form class="cartao" id="form-semana" novalidate>
        <h2>Horário da semana</h2>

          <fieldset class="dia-semana" data-dia="${d.dia_semana}">
            <legend><label class="opcao-inline"><input type="checkbox" name="trabalha" ${d.trabalha ? 'checked' : ''}> ${NOMES_DIAS[d.dia_semana]}</label></legend>
            <div class="quatro-colunas">

              <label>Fecha<input type="time" name="fecha" value="${esc((d.fecha ?? '').slice(0, 5))}"></label>
              <label>Pausa de<input type="time" name="pausa_inicio" value="${esc((d.pausa_inicio ?? '').slice(0, 5))}"></label>
              <label>até<input type="time" name="pausa_fim" value="${esc((d.pausa_fim ?? '').slice(0, 5))}"></label>
            </div>
          </fieldset>`).join('')}

      <div id="especiais"></div>`;
    const form = document.getElementById('form-semana');
    const ajustar = () => form.querySelectorAll('.dia-semana').forEach(($d) => {
      const on = $d.querySelector('[name=trabalha]').checked;
      $d.querySelectorAll('input[type=time]').forEach((i) => { i.disabled = !on; });
      $d.classList.toggle('fechado', !on);
    });
    form.querySelectorAll('[name=trabalha]').forEach((x) => { x.onchange = ajustar; });
    ajustar();
    form.onsubmit = (ev) => {
      ev.preventDefault();
      enviarFormulario(form, async () => {
        const dias = [...form.querySelectorAll('.dia-semana')].map(($d) => ({
          trabalha: $d.querySelector('[name=trabalha]').checked,
          abre: $d.querySelector('[name=abre]').value, fecha: $d.querySelector('[name=fecha]').value,
          pausa_inicio: $d.querySelector('[name=pausa_inicio]').value, pausa_fim: $d.querySelector('[name=pausa_fim]').value,
        }));

        salaoCache = null;
        form.querySelector('button[type=submit]').disabled = false;
        form.querySelector('button[type=submit]').textContent = 'Salvar horários';
        avisar('Horários salvos.');
      });

    await gerenciarLista(document.getElementById('especiais'), {

      campos: [
        { nome: 'data', rotulo: 'Data', tipo: 'data', obrigatorio: true },
        { nome: 'tipo', rotulo: 'Neste dia', tipo: 'select', opcoes: [['fechado', 'Não vou trabalhar'], ['horario_especial', 'Vou trabalhar em horário diferente']], padrao: 'fechado' },
        { nome: 'abre', rotulo: 'Abre', tipo: 'hora', dica: 'Só se for horário diferente.' },
        { nome: 'fecha', rotulo: 'Fecha', tipo: 'hora', dica: 'Só se for horário diferente.' },
        { nome: 'motivo', rotulo: 'Motivo', max: 120, dica: 'Ex.: Feriado de Natal, consulta médica' },
      ],
      resumo: (d) => `<p class="quando">${esc(fmt.partesDoDia(d.data).longa)}</p>
        <p class="suave" style="margin:0">${d.tipo === 'fechado' ? 'Fechado' : `Das ${esc(fmt.horaCurta(d.abre.slice(0, 5)))} às ${esc(fmt.horaCurta(d.fecha.slice(0, 5)))}`}
        ${d.motivo ? ' · ' + esc(d.motivo) : ''}${d.data < hojeNoSalao() ? ' · já passou' : ''}</p>`,
      extras: (d) => d.data >= hojeNoSalao() ? '<button class="pequeno" data-acao="avisar">Avisar clientes</button>' : '',
      acoesExtras: {
        avisar: async (d) => {
          const ags = (await painelApi(`/agendamentos?de=${d.data}&ate=${d.data}`)).filter((a) => ['solicitado', 'agendado'].includes(a.status));
          const tipo = d.tipo === 'fechado' ? 'folga' : 'especial';
          const extra = { motivo: d.motivo, abre: d.abre && fmt.horaCurta(d.abre.slice(0, 5)), fecha: d.fecha && fmt.horaCurta(d.fecha.slice(0, 5)) };
          const geral = `📣 Aviso do salão ${cfgPainel?.nome_salao ?? ''}: no dia ${fmt.partesDoDia(d.data).longa} ` +
            (d.tipo === 'fechado' ? 'não vou atender' : `vou atender das ${extra.abre} às ${extra.fecha}`) + (d.motivo ? ` (${d.motivo})` : '') + '. Obrigada! 💜';
          const $j = janela(`Avisar sobre ${esc(fmt.partesDoDia(d.data).longa)}`, `
            ${ags.length ? `<p class="suave">Clientes com horário nesse dia. Toque em cada nome: o WhatsApp abre com a mensagem pronta.</p>
              <div class="lista-links">${ags.map((a) => linkZapCliente(a, tipo, extra)
                ? `<a class="botao secundario" target="_blank" rel="noopener" href="${esc(linkZapCliente(a, tipo, extra))}">${ICONE_ZAP} ${esc(a.cliente?.nome)} · ${esc(fmt.hora(a.inicio))}</a>` : '').join('')}</div>`
              : '<p class="suave">Ninguém tem horário marcado nesse dia.</p>'}
            <p class="suave" style="margin-top:1rem">Aviso geral, para colar na sua lista de transmissão ou no status do WhatsApp:</p>
            <p class="cartao" style="white-space:pre-line;margin-bottom:.5rem">${esc(geral)}</p>
            <button class="pequeno" data-copiar>Copiar aviso geral</button>`);

            e.target.textContent = await copiarTexto(geral) ? 'Copiado!' : 'Selecione o texto acima e copie';
          };
        },
      },
    });
  }

        salaoCache = null;
        form.querySelector('button[type=submit]').disabled = false;
        form.querySelector('button[type=submit]').textContent = 'Salvar';
        avisar('Dados do salão salvos.');
      });
    };
  }

  // --- ABA: AVALIAÇÕES (ver e excluir)
  async function abaAvaliacoes($c) {
    const lista = await painelApi('/avaliacoes');
    $c.innerHTML = `<h2>Avaliações (${lista.length})</h2>
      ${lista.length ? lista.map((a) => `
        <div class="cartao item" data-id="${esc(a.id)}">
          <p class="estrelas" aria-label="${a.nota} de 5 estrelas">${'★'.repeat(a.nota)}${'☆'.repeat(5 - a.nota)}</p>
          ${a.comentario ? `<p>${esc(a.comentario)}</p>` : ''}
          <p class="suave" style="margin:0">${esc(a.cliente_nome ?? 'Cliente')}${a.atendimento_em ? ' · atendimento de ' + esc(fmt.dataLonga(a.atendimento_em)) : ''}</p>
          <div class="acoes-item"><button class="perigo pequeno" data-acao="excluir">Excluir</button></div>
        </div>`).join('') : '<p class="cartao suave">Ainda não há avaliações. Elas chegam depois dos atendimentos (próximas etapas).</p>'}`;
    $c.querySelectorAll('[data-acao=excluir]').forEach((b) => {
      b.onclick = async () => {
        if (!await perguntar('Excluir esta avaliação?')) return;
        await painelApi(`/avaliacoes/${b.closest('.item').dataset.id}`, { metodo: 'DELETE' });
        avisar('Avaliação excluída.'); telaPainel('avaliacoes');
      };
    });
  }

  function telaLogin(aviso = '') {
    document.body.classList.remove('largo');
    $app.innerHTML = `
      <button class="voltar" data-voltar="#/">← Voltar ao site</button>
      <form class="cartao" id="form-login" novalidate>
        <h1>Área da Lucy</h1>
        <p class="suave">Entre com seu e-mail e senha.</p>
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" inputmode="email" required>
        <label for="senha">Senha</label>
        <div class="linha-senha">
          <input id="senha" type="password" autocomplete="current-password" required>
          <button type="button" class="olhinho" id="ver-senha" aria-label="Mostrar senha" title="Mostrar senha">${ICONE_OLHO}</button>
        </div>
        <button type="submit" class="botao-largo" id="entrar">Entrar</button>
        <p class="mensagem erro" id="msg" role="alert">${esc(aviso)}</p>
      </form>`;

    const $senha = document.getElementById('senha');
    const $ver = document.getElementById('ver-senha');
    // Olhinho aberto = toque para ver a senha; olhinho riscado = toque para esconder.
    $ver.onclick = () => {
      const vaiMostrar = $senha.type === 'password';
      $senha.type = vaiMostrar ? 'text' : 'password';
      $ver.innerHTML = vaiMostrar ? ICONE_OLHO_FECHADO : ICONE_OLHO;
      const rotulo = vaiMostrar ? 'Esconder senha' : 'Mostrar senha';
      $ver.setAttribute('aria-label', rotulo);
      $ver.title = rotulo;
      $senha.focus();
    };

    document.getElementById('form-login').onsubmit = async (ev) => {
      ev.preventDefault();
      const $msg = document.getElementById('msg');
      const $entrar = document.getElementById('entrar');
      const email = document.getElementById('email').value.trim();
      const senha = $senha.value;
      if (!email || !senha) { $msg.textContent = 'Preencha o e-mail e a senha.'; return; }
      $entrar.disabled = true; $entrar.textContent = 'Entrando…'; $msg.textContent = '';
      try {
        const s = await api('/api/login', { metodo: 'POST', corpo: { email, senha } });
        sessao.salvar(s);
        mostrar();
      } catch (e) {
        $msg.textContent = e.message;
        $entrar.disabled = false; $entrar.textContent = 'Entrar';
      }
    };
    document.getElementById('email').focus();
  }

  async function sair() {
    try { await api('/api/sair', { metodo: 'POST', autenticado: true }); } catch {}
    sessao.apagar();
    cfgPainel = null;
    telaLogin();
  }


  // ===================================================================
  // 5. NAVEGAÇÃO: escolhe a tela pelo que vem depois do # no endereço
  // ===================================================================
  // Botões "← Voltar": voltam para a tela anterior do próprio site;
  // se a pessoa chegou direto por um link, vão para um destino seguro.
  let navegouNoSite = false;
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-voltar]');
    if (!b) return;
    e.preventDefault();
    if (navegouNoSite && history.length > 1) history.back();
    else location.hash = b.dataset.voltar;
  });

  function mostrar() {
    const [rota, consulta] = (location.hash.replace(/^#/, '') || '/').split('?');
    const params = new URLSearchParams(consulta || '');
    atualizarNav();
    if (!rota.startsWith('/painel')) document.body.classList.remove('largo');
    document.getElementById('rodape').innerHTML = rota.startsWith('/painel')
      ? '<a href="#/">Ver o site das clientes</a>' : '<a href="#/painel">Área da Lucy</a>';
    if (rota.startsWith('/painel')) telaPainel(rota.slice('/painel'.length), params);
    else if (rota === '/agendar') telaAgendar(params);
    else if (rota.startsWith('/pedido/')) telaPedido(rota.slice('/pedido/'.length), params);
    else if (rota === '/meus-pedidos') telaMeusPedidos();
    else telaInicio();
    topoDaTela();
  }
  window.addEventListener('hashchange', () => { navegouNoSite = true; mostrar(); });
  mostrar();
  </script>
</body>
</html>
