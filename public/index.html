<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucy Cabeleireira</title>
  <meta name="description" content="Salão Lucy Cabeleireira: veja os serviços e peça seu horário.">
  <meta name="theme-color" content="#7a3b5c">
  <!--
    LUCY CABELEIREIRA — página única (HTML + estilo + programação juntos)
    Etapa 3: página da cliente (ver serviços, pedir, ver, remarcar e cancelar horário).

    Endereços (o que vem depois do #):
      /                    → início: serviços, funcionamento e contato
      /#/agendar           → pedir um horário (4 passos)
      /#/agendar?remarcar= → remarcar um pedido existente
      /#/pedido/<código>   → o pedido da cliente (link pessoal)
      /#/meus-pedidos      → pedidos guardados neste aparelho
      /#/painel            → área da Lucy (login)
  -->
  <style>
    :root {
      --vinho: #7a3b5c;
      --vinho-escuro: #5c2a44;
      --rosa: #f6e3ec;
      --rosa-claro: #fbf1f5;
      --creme: #fffaf6;
      --texto: #2b2026;
      --texto-suave: #6b5a63;
      --verde: #2e7d4f;
      --verde-claro: #e6f4ec;
      --amarelo-claro: #fff4d6;
      --amarelo-texto: #7a5300;
      --vermelho: #b3261e;
      --vermelho-claro: #fdecea;
      --borda: #ead7e0;
      --raio: 14px;
    }
    * { box-sizing: border-box; }
    html { font-size: 18px; }  /* letra grande, fácil de ler no celular */
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--creme); color: var(--texto); line-height: 1.5;
    }
    .topo {
      background: var(--vinho); color: #fff; padding: 1rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .marca { color: #fff; text-decoration: none; font-size: 1.4rem; font-weight: 700; letter-spacing: .3px; }
    .marca span { font-weight: 400; opacity: .9; }
    .topo nav a { color: #fff; font-size: .9rem; text-decoration: none; border: 1.5px solid rgba(255,255,255,.6);
      padding: .35rem .75rem; border-radius: 999px; white-space: nowrap; }
    .topo nav a:hover { background: rgba(255,255,255,.12); }
    .marca { white-space: nowrap; }
    @media (max-width: 420px) {  /* celular: nome e botão cabem na mesma linha */
      .topo { padding: .9rem 1rem; }
      .marca { font-size: 1.2rem; }
      .topo nav a { font-size: .8rem; padding: .3rem .6rem; }
    }
    main { flex: 1; width: 100%; max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    main:focus { outline: none; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; color: var(--vinho-escuro); line-height: 1.25; }
    h2 { font-size: 1.15rem; margin: 0 0 .75rem; color: var(--vinho-escuro); }
    p { margin: .4rem 0 1rem; }
    a { color: var(--vinho); }
    .cartao {
      background: #fff; border: 1px solid var(--borda); border-radius: var(--raio);
      padding: 1.25rem; margin-bottom: 1.25rem; box-shadow: 0 2px 10px rgba(122, 59, 92, .06);
    }
    .cartao.destaque { background: linear-gradient(160deg, #fff 0%, var(--rosa-claro) 100%); }
    .suave { color: var(--texto-suave); font-size: .9rem; }
    label { display: block; font-weight: 600; margin: 1rem 0 .35rem; }
    .dica { display: block; font-weight: 400; color: var(--texto-suave); font-size: .85rem; margin-top: .1rem; }
    input, textarea {
      width: 100%; font: inherit; padding: .8rem .9rem; border-radius: 10px;
      border: 1.5px solid var(--borda); background: #fff; color: var(--texto);
    }
    textarea { min-height: 5.5rem; resize: vertical; }
    input:focus, textarea:focus { border-color: var(--vinho); outline: 3px solid rgba(122, 59, 92, .18); }

    /* Campo de senha com o "olhinho" dentro, à direita */
    .linha-senha { position: relative; }
    .linha-senha input { padding-right: 3.25rem; }
    button.olhinho {
      position: absolute; top: 50%; right: .35rem; transform: translateY(-50%);
      width: 2.6rem; height: 2.6rem; min-height: 0; padding: 0;
      display: grid; place-items: center;
      background: transparent; border: none; border-radius: 8px; color: var(--texto-suave);
    }
    button.olhinho:hover { background: var(--rosa-claro); color: var(--vinho); }
    button.olhinho svg { width: 1.4rem; height: 1.4rem; }

    /* Botões (e links com cara de botão) */
    button, .botao {
      font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px;
      padding: .8rem 1.2rem; min-height: 3rem; border: 1.5px solid var(--vinho);
      background: var(--vinho); color: #fff; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; text-align: center;
    }
    button:hover, .botao:hover { background: var(--vinho-escuro); }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #e3a6c2; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.secundario, .botao.secundario { background: #fff; color: var(--vinho); }
    button.secundario:hover, .botao.secundario:hover { background: var(--rosa-claro); }
    button.perigo { background: #fff; color: var(--vermelho); border-color: var(--vermelho); }
    button.perigo:hover { background: var(--vermelho-claro); }
    button.perigo-cheio { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
    .botao-largo { width: 100%; margin-top: 1.25rem; }
    .acoes { display: flex; gap: .75rem; margin-top: 1.25rem; }
    .acoes > * { flex: 1; }

    /* Lista de serviços (início) */
    .servicos { list-style: none; padding: 0; margin: 0; }
    .servicos li { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem 0; border-top: 1px solid var(--borda); }
    .servicos li:first-child { border-top: none; padding-top: 0; }
    .servicos .nome { font-weight: 600; }
    .servicos .preco { font-weight: 700; color: var(--vinho-escuro); white-space: nowrap; text-align: right; }

    /* Escolha de serviços (passo 1) */
    .opcao {
      display: flex; align-items: center; gap: .85rem; margin: 0 0 .6rem; padding: .85rem 1rem;
      border: 1.5px solid var(--borda); border-radius: 12px; background: #fff; cursor: pointer; font-weight: 400;
    }
    .opcao:hover { border-color: #d7b3c5; }
    .opcao input { width: 1.4rem; height: 1.4rem; margin: 0; accent-color: var(--vinho); flex: none; }
    .opcao .info { flex: 1; }
    .opcao .nome { font-weight: 600; display: block; }
    .opcao:has(input:checked) { border-color: var(--vinho); background: var(--rosa-claro); }

    .resumo {
      display: flex; justify-content: space-between; align-items: center; gap: .5rem;
      background: var(--rosa); border-radius: 12px; padding: .75rem 1rem; margin-top: 1rem; font-weight: 600;
    }

    /* Passos */
    .passos { font-size: .85rem; color: var(--texto-suave); margin: 0 0 .25rem; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; }
    .barra { height: 6px; background: var(--rosa); border-radius: 99px; margin-bottom: 1.25rem; overflow: hidden; }
    .barra span { display: block; height: 100%; background: var(--vinho); border-radius: 99px; transition: width .3s; }

    /* Dias e horários (passo 2) */
    .dias { display: flex; gap: .5rem; overflow-x: auto; padding: .25rem .1rem .75rem; scroll-snap-type: x mandatory; }
    .dia {
      flex: none; width: 4.4rem; min-height: 0; padding: .55rem .25rem; scroll-snap-align: start;
      display: flex; flex-direction: column; align-items: center; gap: .05rem;
      background: #fff; color: var(--texto); border: 1.5px solid var(--borda); font-weight: 400;
    }
    .dia:hover { background: var(--rosa-claro); }
    .dia .sem { font-size: .75rem; text-transform: uppercase; color: var(--texto-suave); }
    .dia .num { font-size: 1.3rem; font-weight: 700; }
    .dia .mes { font-size: .75rem; color: var(--texto-suave); }
    .dia:disabled { opacity: .45; background: #f6f1f3; }
    .dia.selecionado { background: var(--vinho); border-color: var(--vinho); color: #fff; }
    .dia.selecionado .sem, .dia.selecionado .mes { color: #fff; }
    .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr)); gap: .5rem; }
    .hora { min-height: 2.75rem; padding: .5rem; background: #fff; color: var(--vinho); font-weight: 600; }
    .hora:hover { background: var(--rosa-claro); }
    .hora.selecionado { background: var(--vinho); color: #fff; }

    /* Situação do pedido */
    .selo { display: inline-block; padding: .3rem .75rem; border-radius: 999px; font-size: .85rem; font-weight: 700; margin-bottom: .75rem; }
    .selo.solicitado { background: var(--amarelo-claro); color: var(--amarelo-texto); }
    .selo.agendado, .selo.concluido { background: var(--verde-claro); color: var(--verde); }
    .selo.cancelado, .selo.recusado, .selo.faltou { background: #f1edef; color: var(--texto-suave); }
    .quando { font-size: 1.15rem; font-weight: 700; margin: 0 0 .25rem; }
    .quando + .suave { margin-top: 0; }
    .itens { list-style: none; padding: 0; margin: 1rem 0 0; }
    .itens li { display: flex; justify-content: space-between; padding: .4rem 0; border-top: 1px dashed var(--borda); }
    .itens li.total { font-weight: 700; border-top: 1.5px solid var(--borda); }
    .link-pessoal { display: flex; gap: .5rem; }
    .link-pessoal input { font-size: .85rem; color: var(--texto-suave); }

    /* Mensagens */
    .mensagem { margin-top: 1rem; padding: .75rem .9rem; border-radius: 10px; }
    .mensagem.erro { background: var(--vermelho-claro); color: var(--vermelho); }
    .mensagem.sucesso { background: var(--verde-claro); color: var(--verde); }
    .mensagem.atencao { background: var(--amarelo-claro); color: var(--amarelo-texto); }
    .mensagem:empty { display: none; }
    .confirmar { border: 1.5px solid var(--vermelho); background: var(--vermelho-claro); border-radius: 12px; padding: 1rem; margin-top: 1rem; }
    .confirmar p { margin-top: 0; }

    .status { list-style: none; padding: 0; margin: 0; }
    .status li { display: flex; gap: .6rem; align-items: center; padding: .35rem 0; }
    .ok { color: var(--verde); font-weight: 700; }
    .falha { color: var(--vermelho); font-weight: 700; }
    .sistema { text-align: center; font-size: .8rem; color: var(--texto-suave); margin: 0; }
    .carregando { color: var(--texto-suave); }
    footer { text-align: center; padding: 1rem; font-size: .85rem; color: var(--texto-suave); }
    footer a { color: var(--vinho); }
    /* Botão "← Voltar" */
    .voltar {
      background: none; border: none; color: var(--vinho); padding: .4rem 0; min-height: 2.5rem;
      font-weight: 600; margin-bottom: .5rem; cursor: pointer;
    }
    .voltar:hover { background: none; text-decoration: underline; }

    /* Painel da Lucy */
    body.largo main { max-width: 52rem; }
    .painel-topo { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .abas { display: flex; gap: .4rem; overflow-x: auto; padding: .5rem 0 1rem; margin-bottom: .25rem; }
    .abas a {
      flex: none; padding: .5rem .95rem; border-radius: 999px; border: 1.5px solid var(--borda);
      background: #fff; color: var(--texto); text-decoration: none; font-weight: 600; font-size: .9rem;
    }
    .abas a:hover { border-color: var(--vinho); }
    .abas a.ativa { background: var(--vinho); border-color: var(--vinho); color: #fff; }
    .linha-titulo { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .linha-titulo h2 { margin: 0; }
    .cartao > .linha-titulo:first-child .quando { margin: 0; }
    #conteudo > .linha-titulo, .secao > .linha-titulo { margin: 1.25rem 0 .75rem; }
    button.pequeno, .botao.pequeno { min-height: 2.4rem; padding: .4rem .85rem; font-size: .9rem; }
    .acoes-item { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; }
    .item .quando { font-size: 1.05rem; }
    .form-cartao { border: 2px solid var(--vinho); }
    .form-cartao h2 { margin-top: 0; }
    select {
      width: 100%; font: inherit; padding: .75rem .9rem; border-radius: 10px;
      border: 1.5px solid var(--borda); background: #fff; color: var(--texto);
    }
    .opcional { font-weight: 400; color: var(--texto-suave); font-size: .85rem; }
    .alerta-cliente { background: var(--amarelo-claro); color: var(--amarelo-texto); border-radius: 8px; padding: .4rem .7rem; margin: .5rem 0 0; font-size: .9rem; }
    .resumo-hoje { display: flex; justify-content: space-between; gap: 1rem; text-decoration: none; color: inherit; flex-wrap: wrap; }
    .navegar-dia { display: flex; gap: .5rem; align-items: center; margin-bottom: .5rem; }
    .navegar-dia input { flex: 1; min-width: 0; }
    .lista-simples { margin-top: .75rem; }
    .item-link { display: flex; justify-content: space-between; gap: 1rem; text-decoration: none; color: inherit; padding: .9rem 1.1rem; margin-bottom: .6rem; }
    .item-link:hover { border-color: var(--vinho); }
    .tres-colunas { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: .6rem; }
    .quatro-colunas { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
    .quatro-colunas label { font-weight: 400; font-size: .85rem; margin: 0; color: var(--texto-suave); }
    .quatro-colunas input { padding: .55rem .5rem; margin-top: .2rem; }
    .dia-semana { border: 1px solid var(--borda); border-radius: 12px; padding: .5rem .9rem .9rem; margin: 0 0 .6rem; }
    .dia-semana.fechado { background: #faf6f8; }
    .dia-semana legend { padding: 0 .3rem; }
    .opcao-inline { display: flex; align-items: center; gap: .5rem; margin: 0; font-weight: 700; }
    .opcao-inline input { width: 1.25rem; height: 1.25rem; accent-color: var(--vinho); }
    .agendamento.cancelado, .agendamento.recusado, .agendamento.faltou { opacity: .7; }
    .estrelas { color: #c98a00; font-size: 1.3rem; letter-spacing: 2px; margin: 0; }
    .fundo-dialogo {
      position: fixed; inset: 0; background: rgba(43, 32, 38, .45); display: grid; place-items: center; padding: 1rem; z-index: 50;
    }
    .dialogo { background: #fff; border-radius: var(--raio); padding: 1.25rem; max-width: 26rem; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .dialogo p { margin-top: 0; }
    @media (max-width: 560px) {
      .tres-colunas { grid-template-columns: 1fr 1fr; }
      .tres-colunas > div:first-child { grid-column: 1 / -1; }
      .quatro-colunas { grid-template-columns: 1fr 1fr; }
    }

    .qr-pix { max-width: 15rem; margin: .5rem auto; background: #fff; border: 1px solid var(--borda); border-radius: 12px; padding: .4rem; }
    .qr-pix svg { display: block; width: 100%; height: auto; }
    .copia-cola { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .72rem; min-height: 4.5rem; word-break: break-all; color: var(--texto-suave); }
    .opcoes-pagamento { display: flex; gap: .5rem; margin-bottom: .75rem; }
    .opcoes-pagamento button { flex: 1; }
    .linha-pagamento { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-top: .75rem; padding-top: .75rem; border-top: 1px dashed var(--borda); }
    .pago { color: var(--verde); font-weight: 700; display: flex; align-items: center; gap: .75rem; margin: .75rem 0 0; }
    .selo.atrasado { background: var(--vermelho-claro); color: var(--vermelho); }
    .escolher-estrelas { display: flex; gap: .25rem; }
    .escolher-estrelas button { background: none; border: none; color: #c98a00; font-size: 2.2rem; padding: 0 .15rem; min-height: 3rem; line-height: 1; }
    .escolher-estrelas button:hover { background: none; transform: scale(1.1); }
    .catalogo { padding: .85rem 0; border-top: 1px solid var(--borda); }
    .catalogo:first-of-type { border-top: none; padding-top: .25rem; }
    .codigo { font-size: 1.05rem; color: var(--vinho-escuro); letter-spacing: .5px; margin-right: .35rem; }
    .link-catalogos { display: block; text-align: center; margin-top: .9rem; font-weight: 600; }
    .lista-links { display: grid; gap: .5rem; margin: .5rem 0 1rem; }
    .lista-links .botao { justify-content: flex-start; }
    .linha-lembrete { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .8rem 1rem; margin-bottom: .6rem; }
    .dialogo { max-height: calc(100vh - 2rem); overflow-y: auto; }
    .dialogo h2 { margin-top: 0; }

    /* Texto só para leitores de tela (acessibilidade) */
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <header class="topo">
    <a href="#/" class="marca">Lucy <span>Cabeleireira</span></a>
    <nav id="nav" aria-label="Atalhos"></nav>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <footer id="rodape">
    <a href="#/painel">Área da Lucy</a>
  </footer>

  <script>
  // ===================================================================
  // 1. ENDEREÇO DO SERVIDOR
  //    Vazio = o mesmo site. (Na versão React, vira o link do servidor.)
  // ===================================================================
  const API = '';


  // ===================================================================
  // 2. PEQUENAS FERRAMENTAS
  // ===================================================================
  const $app = document.getElementById('app');
  const $nav = document.getElementById('nav');

  // Evita que algum texto vindo de fora vire código na página.
  function esc(texto) {
    return String(texto ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  // Guardar e ler coisas no próprio aparelho (com cuidado, pois pode falhar).
  const guardado = {
    ler(chave, padrao) { try { return JSON.parse(localStorage.getItem(chave)) ?? padrao; } catch { return padrao; } },
    salvar(chave, valor) { try { localStorage.setItem(chave, JSON.stringify(valor)); } catch {} },
    apagar(chave) { try { localStorage.removeItem(chave); } catch {} },
  };

  // O "crachá" da Lucy, para ela não ter que digitar a senha toda vez.
  const sessao = {
    ler: () => guardado.ler('lucy.sessao', null),
    salvar: (s) => guardado.salvar('lucy.sessao', s),
    apagar: () => guardado.apagar('lucy.sessao'),
  };

  // Os pedidos feitos neste aparelho (só os códigos dos links pessoais).
  const meusPedidos = {
    listar: () => guardado.ler('lucy.pedidos', []),
    adicionar(token) { guardado.salvar('lucy.pedidos', [token, ...this.listar().filter((t) => t !== token)].slice(0, 10)); },
    remover(token) { guardado.salvar('lucy.pedidos', this.listar().filter((t) => t !== token)); },
  };

  // Formatação no jeito brasileiro, sempre no horário de Brasília.
  const FUSO = 'America/Sao_Paulo';
  const fmt = {
    reais: (n) => Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }),
    duracao: (min) => { const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h${m ? String(m).padStart(2, '0') : ''}` : `${m} min`; },
    dataLonga: (iso) => new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(iso)),
    hora: (iso) => new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, hour: '2-digit', minute: '2-digit' }).format(new Date(iso)),
    horaCurta: (hhmm) => { const [h, m] = hhmm.split(':'); return `${Number(h)}h${m !== '00' ? m : ''}`; },
    // Para os botões de dia: "qua", "4", "dez"
    partesDoDia(data) {
      const d = new Date(`${data}T12:00:00-03:00`);
      const f = (o) => new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, ...o }).format(d).replace('.', '');
      return { sem: f({ weekday: 'short' }), num: f({ day: 'numeric' }), mes: f({ month: 'short' }), longa: f({ weekday: 'long', day: 'numeric', month: 'long' }) };
    },
  };
  const somarDias = (data, n) => { const d = new Date(`${data}T12:00:00Z`); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const diaDaSemana = (data) => new Date(`${data}T12:00:00-03:00`).getUTCDay();
  const dataNoFuso = (iso) => new Intl.DateTimeFormat('en-CA', { timeZone: FUSO }).format(new Date(iso));  // "AAAA-MM-DD"
  const NOMES_DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

  // WhatsApp por "link pronto": abre o app com a mensagem escrita; a pessoa só toca em Enviar.
  const zapCom = (numero, texto) => `https://wa.me/${encodeURIComponent(numero)}?text=${encodeURIComponent(texto)}`;
  const enderecoSite = () => `${location.origin}${location.pathname}`;
  const quandoTexto = (a) => `${fmt.dataLonga(a.inicio)}, às ${fmt.hora(a.inicio)}`;
  const servicosTexto = (a) => a.servicos.map((x) => x.nome).join(' + ');
  const ICONE_ZAP = '💬';

  // Copia um texto. Se o navegador não deixar, usa um jeito alternativo.
  async function copiarTexto(texto) {
    try {
      await Promise.race([navigator.clipboard.writeText(texto), new Promise((_, nao) => setTimeout(nao, 1500))]);
      return true;
    } catch {
      const t = document.createElement('textarea');
      t.value = texto; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch {}
      t.remove();
      return ok;
    }
  }

  // Conversa com o server.js. Se o crachá da Lucy venceu, renova sozinho uma vez.
  async function api(caminho, { metodo = 'GET', corpo, autenticado = false, renovado = false } = {}) {
    const headers = {};
    if (corpo !== undefined) headers['Content-Type'] = 'application/json';
    if (autenticado) {
      let s = sessao.ler();
      if (s && !renovado && s.expires_at && s.expires_at * 1000 - Date.now() < 60_000) {
        s = await renovarSessao();  // vai vencer em menos de 1 minuto
      }
      if (s) headers.Authorization = 'Bearer ' + s.access_token;
    }
    let resposta;
    try {
      resposta = await fetch(API + caminho, {
        method: metodo, headers,
        body: corpo !== undefined ? JSON.stringify(corpo) : undefined,
      });
    } catch {
      throw new ErroApi('Sem conexão com o servidor. Confira a internet e tente de novo.', 0);
    }
    if (resposta.status === 401 && autenticado && !renovado && await renovarSessao()) {
      return api(caminho, { metodo, corpo, autenticado, renovado: true });
    }
    const dados = await resposta.json().catch(() => ({}));
    if (!resposta.ok) throw new ErroApi(dados.erro || 'Algo deu errado. Tente de novo.', resposta.status);
    return dados;
  }

  async function renovarSessao() {
    const s = sessao.ler();
    if (!s?.refresh_token) return null;
    try {
      const nova = await api('/api/renovar', { metodo: 'POST', corpo: { refresh_token: s.refresh_token } });

      return nova;
    } catch {

    }
  }

  // ===================================================================
  // QR CODE (desenhado aqui mesmo, sem depender de sites externos)
  // Padrão ISO/IEC 18004: modo byte, correção de erro nível M, versões 1 a 40.
  // ===================================================================
  const QR = (() => {
    const ECC_M = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
    const BLOCOS_M = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];

    const modulosDeDados = (v) => {
      let r = (16 * v + 128) * v + 64;
      if (v >= 2) {
        const n = Math.floor(v / 7) + 2;
        r -= (25 * n - 10) * n - 55;
        if (v >= 7) r -= 36;
      }
      return r;
    };
    const capacidade = (v) => Math.floor(modulosDeDados(v) / 8) - ECC_M[v] * BLOCOS_M[v];

    // Aritmética do campo de Galois GF(256) e Reed-Solomon
    const mult = (x, y) => {
      let z = 0;
      for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; }
      return z;
    };
    const divisor = (grau) => {
      const r = new Array(grau).fill(0); r[grau - 1] = 1;
      let raiz = 1;
      for (let i = 0; i < grau; i++) {
        for (let j = 0; j < r.length; j++) { r[j] = mult(r[j], raiz); if (j + 1 < r.length) r[j] ^= r[j + 1]; }
        raiz = mult(raiz, 0x02);
      }
      return r;
    };
    const resto = (dados, div) => {
      const r = new Array(div.length).fill(0);
      for (const b of dados) {
        const f = b ^ r.shift(); r.push(0);
        div.forEach((c, i) => { r[i] ^= mult(c, f); });
      }
      return r;
    };

    function gerar(texto) {
      const bytes = Array.from(new TextEncoder().encode(texto));
      let v = 1;
      for (; v <= 40; v++) {
        const bitsContagem = v <= 9 ? 8 : 16;
        if (4 + bitsContagem + bytes.length * 8 <= capacidade(v) * 8) break;
      }
      if (v > 40) throw new Error('Texto grande demais para QR code');

      // 1) Sequência de bits: modo byte (0100), tamanho, dados, terminador e preenchimento
      const bits = [];
      const por = (valor, n) => { for (let i = n - 1; i >= 0; i--) bits.push((valor >>> i) & 1); };
      por(4, 4); por(bytes.length, v <= 9 ? 8 : 16); bytes.forEach((b) => por(b, 8));
      const cap = capacidade(v) * 8;
      por(0, Math.min(4, cap - bits.length));
      por(0, (8 - (bits.length % 8)) % 8);
      for (let pad = 0xec; bits.length < cap; pad ^= 0xec ^ 0x11) por(pad, 8);
      const dados = [];
      for (let i = 0; i < bits.length; i += 8) dados.push(parseInt(bits.slice(i, i + 8).join(''), 2));

      // 2) Correção de erros e intercalação dos blocos
      const nBlocos = BLOCOS_M[v], eccLen = ECC_M[v];
      const total = Math.floor(modulosDeDados(v) / 8);
      const curtos = nBlocos - (total % nBlocos), tamCurto = Math.floor(total / nBlocos);
      const div = divisor(eccLen), blocos = [];
      for (let i = 0, k = 0; i < nBlocos; i++) {
        const d = dados.slice(k, k + tamCurto - eccLen + (i < curtos ? 0 : 1));
        k += d.length;
        const ecc = resto(d, div);
        if (i < curtos) d.push(0);
        blocos.push(d.concat(ecc));
      }
      const final = [];
      for (let i = 0; i < blocos[0].length; i++) {
        blocos.forEach((b, j) => { if (i !== tamCurto - eccLen || j >= curtos) final.push(b[i]); });
      }

      // 3) Desenho: padrões fixos, dados, máscara
      const tam = v * 4 + 17;
      const mod = Array.from({ length: tam }, () => new Array(tam).fill(false));
      const fixo = Array.from({ length: tam }, () => new Array(tam).fill(false));
      const pinta = (x, y, escuro) => { mod[y][x] = escuro; fixo[y][x] = true; };
      for (let i = 0; i < tam; i++) { pinta(6, i, i % 2 === 0); pinta(i, 6, i % 2 === 0); }
      const localizador = (cx, cy) => {
        for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
          const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy));
          if (x >= 0 && x < tam && y >= 0 && y < tam) pinta(x, y, d !== 2 && d !== 4);
        }
      };
      localizador(3, 3); localizador(tam - 4, 3); localizador(3, tam - 4);
      if (v > 1) {
        const n = Math.floor(v / 7) + 2;
        const passo = v === 32 ? 26 : Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
        const pos = [6];
        for (let p = tam - 7; pos.length < n; p -= passo) pos.splice(1, 0, p);
        pos.forEach((a, i) => pos.forEach((b, j) => {
          if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) return;
          for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) pinta(a + dx, b + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }));
      }
      const formato = (mascara) => {
        const d = (0 << 3) | mascara;  // nível M = 00
        let r = d;
        for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
        const b = ((d << 10) | r) ^ 0x5412;
        const bit = (i) => ((b >>> i) & 1) !== 0;
        for (let i = 0; i <= 5; i++) pinta(8, i, bit(i));
        pinta(8, 7, bit(6)); pinta(8, 8, bit(7)); pinta(7, 8, bit(8));
        for (let i = 9; i < 15; i++) pinta(14 - i, 8, bit(i));
        for (let i = 0; i < 8; i++) pinta(tam - 1 - i, 8, bit(i));
        for (let i = 8; i < 15; i++) pinta(8, tam - 15 + i, bit(i));
        pinta(8, tam - 8, true);
      };
      formato(0);  // reserva a área do formato
      if (v >= 7) {
        let r = v;
        for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1f25);
        const b = (v << 12) | r;
        for (let i = 0; i < 18; i++) {
          const e = ((b >>> i) & 1) !== 0, a = tam - 11 + (i % 3), c = Math.floor(i / 3);
          pinta(a, c, e); pinta(c, a, e);
        }
      }
      let i = 0;
      for (let dir = tam - 1; dir >= 1; dir -= 2) {
        if (dir === 6) dir = 5;
        for (let vert = 0; vert < tam; vert++) for (let j = 0; j < 2; j++) {
          const x = dir - j, sobe = ((dir + 1) & 2) === 0, y = sobe ? tam - 1 - vert : vert;
          if (!fixo[y][x] && i < final.length * 8) { mod[y][x] = ((final[i >>> 3] >>> (7 - (i & 7))) & 1) !== 0; i++; }
        }
      }
      const MASCARAS = [
        (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
        (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
        (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0, (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
      ];
      const aplica = (m) => { for (let y = 0; y < tam; y++) for (let x = 0; x < tam; x++) if (!fixo[y][x] && MASCARAS[m](x, y)) mod[y][x] = !mod[y][x]; };
      // Escolhe a máscara com menos "penalidade" (sequências longas, blocos e desequilíbrio)
      const penalidade = () => {
        let p = 0;
        for (let k = 0; k < 2; k++) for (let a = 0; a < tam; a++) {
          let corr = 1;
          for (let b = 1; b < tam; b++) {
            const atual = k ? mod[b][a] : mod[a][b], ant = k ? mod[b - 1][a] : mod[a][b - 1];
            if (atual === ant) { corr++; if (corr === 5) p += 3; else if (corr > 5) p++; } else corr = 1;
          }
        }
        for (let y = 0; y < tam - 1; y++) for (let x = 0; x < tam - 1; x++) {
          const c = mod[y][x];
          if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3;
        }
        const escuros = mod.flat().filter(Boolean).length;
        p += Math.floor(Math.abs(escuros * 20 - tam * tam * 10) / (tam * tam)) * 10;
        return p;
      };
      let melhor = 0, menor = Infinity;
      for (let m = 0; m < 8; m++) {
        aplica(m); formato(m);
        const pen = penalidade();
        if (pen < menor) { menor = pen; melhor = m; }
        aplica(m);
      }
      aplica(melhor); formato(melhor);
      return mod;
    }

    // Desenha como imagem SVG (com margem branca de 4 módulos, exigida pelo padrão)
    function svg(texto, rotulo = 'QR code') {
      const m = gerar(texto), n = m.length, margem = 4, lado = n + margem * 2;
      let d = '';
      m.forEach((linha, y) => linha.forEach((e, x) => { if (e) d += `M${x + margem},${y + margem}h1v1h-1z`; }));
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${lado} ${lado}" role="img" aria-label="${rotulo}"
        shape-rendering="crispEdges"><rect width="${lado}" height="${lado}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
    }
    return { gerar, svg };
  })();

  function resumoDoFuncionamento(horarios) {

    if (!abertos.length) return 'Horários em breve.';
    const faixa = (h) => `das ${fmt.horaCurta(h.abre.slice(0, 5))} às ${fmt.horaCurta(h.fecha.slice(0, 5))}`;
    const iguais = abertos.every((h) => h.abre === abertos[0].abre && h.fecha === abertos[0].fecha);
    if (abertos.length === 7 && iguais) return `Todos os dias, ${faixa(abertos[0])}`;
    return horarios.map((h) => `${NOMES_DIAS[h.dia_semana]}: ${h.trabalha ? faixa(h) : 'fechado'}`).join('<br>');
  }

  let ag = null;

  async function telaAgendar(params) {
    $app.innerHTML = `<p class="carregando">Carregando…</p>`;
    let d;
    try { d = await carregarSalao(); } catch (e) { return telaErro(e.message); }

    const remarcar = params.get('remarcar');
    const retorno = params.get('retorno');
    ag = {
      passo: 1, servicos: new Set(), data: null, inicio: null, horarios: [], remarcar: null, pedido: null,
      ...guardado.ler('lucy.cliente', {}),  // nome, whatsapp e e-mail usados da última vez neste aparelho
      necessidades: '', observacao: '',
    };
    if (remarcar) {
      try {
        const p = await api(`/api/publico/pedidos/${encodeURIComponent(remarcar)}`);
        if (!p.pode_alterar) return telaErro('Este pedido não pode mais ser alterado.', false);
        ag.remarcar = remarcar;
        ag.pedido = p;
        ag.data = dataNoFuso(p.inicio);  // começa mostrando o dia do próprio pedido
        ag.diaManual = true;
        p.servicos.forEach((s) => { if (d.servicos.some((x) => x.id === s.id)) ag.servicos.add(s.id); });
      } catch (e) { return telaErro(e.message); }
    }
    if (retorno) {
      // Retorno: já vem com os mesmos serviços e o dia sugerido
      try {
        const p = await api(`/api/publico/pedidos/${encodeURIComponent(retorno)}`);
        ag.retornoDe = retorno;
        p.servicos.forEach((s) => { if (d.servicos.some((x) => x.id === s.id)) ag.servicos.add(s.id); });
        if (p.retorno?.sugerido_para) {
          ag.sugestaoRetorno = p.retorno.sugerido_para;
          ag.data = p.retorno.sugerido_para < d.agenda.ate ? p.retorno.sugerido_para : d.agenda.ate;
        }
      } catch { /* se o link estiver errado, segue como pedido normal */ }
    }
    desenharPasso();
  }

  function escolha() {
    const lista = salaoCache.servicos.filter((s) => ag.servicos.has(s.id));
    return {
      lista,
      duracao: lista.reduce((t, s) => t + s.duracao_min, 0),
      total: lista.reduce((t, s) => t + s.preco, 0),

  // Quais passos existem: ao remarcar, não precisa pedir os dados de novo.
  const passosDoFluxo = () => ag.remarcar ? [1, 2, 4] : [1, 2, 3, 4];

  function cabecalhoDoPasso(titulo) {
    const passos = passosDoFluxo();
    const n = passos.indexOf(ag.passo) + 1;
    return `
      <p class="passos">${ag.remarcar ? 'Remarcar · ' : ''}Passo ${n} de ${passos.length}</p>
      <div class="barra" aria-hidden="true"><span style="width:${(n / passos.length) * 100}%"></span></div>
      <h1>${titulo}</h1>`;
  }

  function irParaPasso(direcao) {
    const passos = passosDoFluxo();
    ag.passo = passos[passos.indexOf(ag.passo) + direcao];
    desenharPasso();
    topoDaTela();
  }

  function desenharPasso() {
    if (ag.passo === 1) passoServicos();
    else if (ag.passo === 2) passoQuando();
    else if (ag.passo === 3) passoDados();
    else passoRevisar();
  }

  // Passo 1: quais serviços?
  function passoServicos() {
    $app.innerHTML = `
      <div class="cartao">
        ${cabecalhoDoPasso('O que você quer fazer?')}
        <p class="suave">Pode escolher mais de um.</p>
        <fieldset style="border:0;padding:0;margin:0">
          <legend class="sr">Serviços</legend>
          ${salaoCache.servicos.map((s) => `
            <label class="opcao">
              <input type="checkbox" value="${esc(s.id)}" ${ag.servicos.has(s.id) ? 'checked' : ''}>
              <span class="info"><span class="nome">${esc(s.nome)}</span>
                <span class="suave">${s.descricao ? esc(s.descricao) + ' · ' : ''}${fmt.duracao(s.duracao_min)}</span></span>
              <strong>${fmt.reais(s.preco)}</strong>
            </label>`).join('')}
        </fieldset>
        <div class="resumo" id="resumo" aria-live="polite"></div>
        <div class="acoes">
          <a class="botao secundario" href="${ag.remarcar ? '#/pedido/' + esc(ag.remarcar) : '#/'}">Voltar</a>
          <button id="continuar">Continuar</button>
        </div>
      </div>`;

    const atualizar = () => {
      const e = escolha();
      document.getElementById('resumo').innerHTML = e.lista.length
        ? `<span>${e.lista.length} serviço${e.lista.length > 1 ? 's' : ''} · ${fmt.duracao(e.duracao)}</span><span>${fmt.reais(e.total)}</span>`
        : '<span>Nenhum serviço escolhido</span>';
      document.getElementById('continuar').disabled = !e.lista.length;
    };
    $app.querySelectorAll('.opcao input').forEach((cx) => {
      cx.onchange = () => {
        cx.checked ? ag.servicos.add(cx.value) : ag.servicos.delete(cx.value);
        ag.inicio = null;  // mudou a duração: o horário escolhido precisa ser revisto
        atualizar();
      };
    });
    document.getElementById('continuar').onclick = () => irParaPasso(+1);
    atualizar();
  }

  // O salão abre neste dia? (folgas e horários especiais valem mais que a semana)
  function diaAberto(data) {
    const especial = salaoCache.especiais.find((e) => e.data === data);
    if (especial) return especial.tipo !== 'fechado';
    return !!salaoCache.horarios.find((h) => h.dia_semana === diaDaSemana(data))?.trabalha;
  }

  // Passo 2: quando?
  function passoQuando() {
    const { hoje, ate } = salaoCache.agenda;
    const dias = [];
    for (let d = hoje; d <= ate; d = somarDias(d, 1)) dias.push(d);
    if (!ag.data || ag.data > ate || ag.data < hoje || !diaAberto(ag.data)) {
      ag.data = dias.find((d) => d >= (ag.data && ag.data <= ate ? ag.data : hoje) && diaAberto(d)) ?? dias.find(diaAberto) ?? null;
    }

    $app.innerHTML = `
      <div class="cartao">
        ${cabecalhoDoPasso('Escolha o dia e o horário')}
        <p class="suave">Duração prevista: ${fmt.duracao(escolha().duracao)}</p>
        ${ag.sugestaoRetorno ? `<p class="mensagem atencao">Retorno sugerido: por volta de <strong>${esc(fmt.partesDoDia(ag.sugestaoRetorno).longa)}</strong>.</p>` : ''}
        <div class="dias" role="group" aria-label="Dias">
          ${dias.map((d) => {
            const p = fmt.partesDoDia(d), aberto = diaAberto(d);
            return `<button class="dia ${d === ag.data ? 'selecionado' : ''}" data-dia="${d}" ${aberto ? '' : 'disabled'}
              aria-pressed="${d === ag.data}" aria-label="${esc(p.longa)}${aberto ? '' : ' (fechado)'}">
              <span class="sem">${esc(p.sem)}</span><span class="num">${esc(p.num)}</span><span class="mes">${aberto ? esc(p.mes) : 'fechado'}</span>
            </button>`;
          }).join('')}
        </div>
        <h2 id="t-horas" style="margin-top:.5rem">${ag.data ? esc(fmt.partesDoDia(ag.data).longa) : ''}</h2>
        <div id="horas" aria-labelledby="t-horas"><p class="carregando">Buscando horários…</p></div>
        <p class="mensagem erro" id="msg" role="alert"></p>
        <div class="acoes">
          <button class="secundario" id="voltar">Voltar</button>
          <button id="continuar" disabled>Continuar</button>
        </div>
      </div>`;

    $app.querySelectorAll('.dia').forEach((b) => {
      b.onclick = () => { ag.data = b.dataset.dia; ag.diaManual = true; ag.inicio = null; passoQuando(); };
    });
    document.getElementById('voltar').onclick = () => irParaPasso(-1);
    document.getElementById('continuar').onclick = () => irParaPasso(+1);
    $app.querySelector('.dia.selecionado')?.scrollIntoView({ block: 'nearest', inline: 'center' });
    carregarHoras();
  }

  async function carregarHoras() {
    const $horas = document.getElementById('horas');
    if (!ag.data) { $horas.innerHTML = '<p>Não há dias disponíveis no momento.</p>'; return; }
    const qs = new URLSearchParams({ data: ag.data, servicos: [...ag.servicos].join(',') });
    if (ag.remarcar) qs.set('pedido', ag.remarcar);
    try {
      const r = await api(`/api/publico/horarios?${qs}`);
      ag.horarios = r.horarios;
      // Se a página escolheu o dia sozinha e ele está cheio (ou já passou do horário),
      // pula para o próximo dia aberto — até 14 tentativas.
      if (!r.horarios.length && !ag.diaManual && (ag.pulos ?? 0) < 14) {
        const { ate } = salaoCache.agenda;
        let prox = somarDias(ag.data, 1);
        while (prox <= ate && !diaAberto(prox)) prox = somarDias(prox, 1);
        if (prox <= ate) { ag.pulos = (ag.pulos ?? 0) + 1; ag.data = prox; return passoQuando(); }
      }
      if (!r.horarios.some((h) => h.inicio === ag.inicio)) ag.inicio = null;
      $horas.innerHTML = r.horarios.length
        ? `<div class="horas">${r.horarios.map((h) => `
            <button class="hora ${h.inicio === ag.inicio ? 'selecionado' : ''}" data-inicio="${esc(h.inicio)}"
              aria-pressed="${h.inicio === ag.inicio}">${esc(h.hora)}</button>`).join('')}</div>`
        : '<p>Não sobrou horário livre neste dia para esses serviços. Que tal outro dia?</p>';
      $horas.querySelectorAll('.hora').forEach((b) => {
        b.onclick = () => {
          ag.inicio = b.dataset.inicio;
          $horas.querySelectorAll('.hora').forEach((x) => {
            x.classList.toggle('selecionado', x === b);
            x.setAttribute('aria-pressed', String(x === b));
          });
          document.getElementById('continuar').disabled = false;
        };
      });
      document.getElementById('continuar').disabled = !ag.inicio;
    } catch (e) {
      $horas.innerHTML = '';
      document.getElementById('msg').textContent = e.message;
    }
  }

  // Passo 3: seus dados
  function passoDados() {
    $app.innerHTML = `
      <form class="cartao" id="form-dados" novalidate>
        ${cabecalhoDoPasso('Seus dados')}
        <label for="nome">Nome</label>
        <input id="nome" autocomplete="name" maxlength="80" required value="${esc(ag.nome)}">
        <label for="whatsapp">WhatsApp <span class="dica">Com DDD. É por ele que a Lucy fala com você.</span></label>
        <input id="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" required value="${esc(ag.whatsapp)}">
        <label for="email">E-mail <span class="dica">Opcional.</span></label>
        <input id="email" type="email" inputmode="email" autocomplete="email" maxlength="120" value="${esc(ag.email)}">

        <label for="necessidades">Alguma necessidade específica?
          <span class="dica">Opcional. Por exemplo: acessibilidade ou mobilidade reduzida, sensibilidade a cheiros ou barulho,
          gestação, alergias. Conte o que for importante para a Lucy te receber bem.</span></label>
        <textarea id="necessidades" maxlength="500">${esc(ag.necessidades)}</textarea>
        <label for="observacao">Quer deixar algum recado? <span class="dica">Opcional.</span></label>
        <textarea id="observacao" maxlength="500">${esc(ag.observacao)}</textarea>
        <p class="suave">Seus dados ficam só com a Lucy e são usados apenas para o seu atendimento.</p>
        <p class="mensagem erro" id="msg" role="alert"></p>
        <div class="acoes">
          <button type="button" class="secundario" id="voltar">Voltar</button>
          <button type="submit">Continuar</button>
        </div>
      </form>`;

    const ler = () => {
      ag.nome = document.getElementById('nome').value.trim();
      ag.whatsapp = document.getElementById('whatsapp').value.trim();
      ag.email = document.getElementById('email').value.trim();
      ag.necessidades = document.getElementById('necessidades').value.trim();
      ag.observacao = document.getElementById('observacao').value.trim();
    };
    document.getElementById('voltar').onclick = () => { ler(); irParaPasso(-1); };
    document.getElementById('form-dados').onsubmit = (ev) => {
      ev.preventDefault();
      ler();
      const $msg = document.getElementById('msg');
      const numeros = ag.whatsapp.replace(/\D/g, '');
      if (ag.nome.length < 2) { $msg.textContent = 'Informe seu nome.'; return document.getElementById('nome').focus(); }
      if (![10, 11, 12, 13].includes(numeros.length)) {
        $msg.textContent = 'Informe um WhatsApp válido, com DDD.'; return document.getElementById('whatsapp').focus();
      }
      if (ag.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ag.email)) {
        $msg.textContent = 'Confira o e-mail (ou deixe em branco).'; return document.getElementById('email').focus();
      }
      irParaPasso(+1);
    };
  }

  // Passo 4: conferir e enviar
  function passoRevisar() {
    const e = escolha();
    $app.innerHTML = `
      <div class="cartao">
        ${cabecalhoDoPasso(ag.remarcar ? 'Confira o novo horário' : 'Confira seu pedido')}
        <p class="quando">${esc(fmt.dataLonga(ag.inicio))}</p>
        <p class="suave">${esc(fmt.hora(ag.inicio))} às ${esc(fmt.hora(Date.parse(ag.inicio) + e.duracao * 60000))}</p>
        <ul class="itens">
          ${e.lista.map((s) => `<li><span>${esc(s.nome)}</span><span>${fmt.reais(s.preco)}</span></li>`).join('')}
          <li class="total"><span>Total</span><span>${fmt.reais(e.total)}</span></li>
        </ul>
        ${ag.remarcar ? '' : `
          <p class="suave" style="margin-top:1rem">${esc(ag.nome)} · ${esc(ag.whatsapp)}${ag.email ? ' · ' + esc(ag.email) : ''}</p>
          ${ag.necessidades ? `<p class="suave">Necessidades: ${esc(ag.necessidades)}</p>` : ''}
          ${ag.observacao ? `<p class="suave">Recado: ${esc(ag.observacao)}</p>` : ''}`}
        <p class="mensagem atencao">Este é um <strong>pedido</strong>. A Lucy vai confirmar o horário com você.
          O pagamento é feito no salão (Pix, cartão ou dinheiro).</p>
        <p class="mensagem erro" id="msg" role="alert"></p>
        <div class="acoes">
          <button class="secundario" id="voltar">Voltar</button>
          <button id="enviar">${ag.remarcar ? 'Remarcar' : 'Enviar pedido'}</button>
        </div>
      </div>`;

    document.getElementById('voltar').onclick = () => irParaPasso(-1);
    document.getElementById('enviar').onclick = async () => {
      const $b = document.getElementById('enviar');
      const $msg = document.getElementById('msg');
      $b.disabled = true; $b.textContent = 'Enviando…'; $msg.textContent = '';
      try {
        let p;
        if (ag.remarcar) {
          p = await api(`/api/publico/pedidos/${encodeURIComponent(ag.remarcar)}`, {
            metodo: 'PATCH', corpo: { inicio: ag.inicio, servicos: [...ag.servicos] },
          });
        } else {
          p = await api('/api/publico/pedidos', { metodo: 'POST', corpo: {
            nome: ag.nome, whatsapp: ag.whatsapp, email: ag.email,
            necessidades: ag.necessidades, observacao: ag.observacao,
            servicos: [...ag.servicos], inicio: ag.inicio, retorno_de: ag.retornoDe ?? null,
          } });
          guardado.salvar('lucy.cliente', { nome: ag.nome, whatsapp: ag.whatsapp, email: ag.email });
        }
        meusPedidos.adicionar(p.token);
        location.hash = `#/pedido/${p.token}?${ag.remarcar ? 'remarcado' : 'novo'}=1`;
      } catch (e) {
        $msg.textContent = e.message;
        $b.disabled = false; $b.textContent = ag.remarcar ? 'Remarcar' : 'Enviar pedido';
        if (e.status === 409) {  // horário ocupado nesse meio-tempo: volta para escolher outro
          $msg.innerHTML = `${esc(e.message)} <button class="secundario botao-largo" id="outro">Escolher outro horário</button>`;
          document.getElementById('outro').onclick = () => { ag.passo = 2; ag.inicio = null; desenharPasso(); topoDaTela(); };
        }
      }
    };
  }

  // --- O PEDIDO DA CLIENTE (VISUALIZAR, com atalhos para REMARCAR e CANCELAR)
  async function telaPedido(token, params) {
    $app.innerHTML = `<p class="carregando">Carregando seu pedido…</p>`;
    let p;
    try {
      p = await api(`/api/publico/pedidos/${encodeURIComponent(token)}`);
    } catch (e) {
      if (e.status === 404) meusPedidos.remover(token);
      atualizarNav();
      return telaErro(e.message, e.status !== 404);
    }
    meusPedidos.adicionar(p.token);
    atualizarNav();
    const salao = await carregarSalao().catch(() => null);

    const link = `${location.origin}${location.pathname}#/pedido/${p.token}`;
    // Mensagem pronta para a cliente avisar a Lucy pelo WhatsApp
    const tipoAviso = params.get('novo') ? 'novo' : params.get('remarcado') ? 'remarcado' : params.get('cancelado') ? 'cancelado' : '';
    const textoParaLucy = {
      novo: `Olá, Lucy! Aqui é ${p.primeiro_nome}. Acabei de pedir um horário pelo site: ${servicosTexto(p)}, ${quandoTexto(p)}. ${link}`,
      remarcado: `Olá, Lucy! Aqui é ${p.primeiro_nome}. Remarquei meu horário pelo site para ${quandoTexto(p)} (${servicosTexto(p)}). ${link}`,
      cancelado: `Olá, Lucy! Aqui é ${p.primeiro_nome}. Precisei cancelar meu horário de ${quandoTexto(p)}. Desculpe!`,
      '': `Olá, Lucy! Aqui é ${p.primeiro_nome}. Sobre o meu horário de ${quandoTexto(p)}: ${link}`,
    }[tipoAviso];
    const botaoZap = salao?.salao?.whatsapp
      ? `<a class="botao ${tipoAviso ? '' : 'secundario'} botao-largo" href="${esc(zapCom(salao.salao.whatsapp, textoParaLucy))}"
          target="_blank" rel="noopener">${ICONE_ZAP} ${tipoAviso ? 'Avisar a Lucy no WhatsApp' : 'Falar com a Lucy no WhatsApp'}</a>` : '';
    const aviso = params.get('novo')
      ? `<p class="mensagem sucesso" role="status"><strong>Pedido enviado, ${esc(p.primeiro_nome)}!</strong> A Lucy vai ver e confirmar o seu horário.</p>`
      : params.get('remarcado')
        ? '<p class="mensagem sucesso" role="status"><strong>Horário remarcado!</strong> A Lucy vai confirmar o novo horário.</p>'
        : params.get('cancelado') ? '<p class="mensagem sucesso" role="status">Pedido cancelado.</p>' : '';

    $app.innerHTML = `
      <button class="voltar" data-voltar="#/">← Voltar</button>
      ${aviso}
      ${tipoAviso ? `<div style="margin:-.25rem 0 1.25rem">${botaoZap}</div>` : ''}
      <div class="cartao">
        <span class="selo ${esc(p.status)}">${esc(p.status_texto)}</span>
        <p class="quando">${esc(fmt.dataLonga(p.inicio))}</p>
        <p class="suave">${esc(fmt.hora(p.inicio))} às ${esc(fmt.hora(p.fim))}</p>
        <ul class="itens">
          ${p.servicos.map((s) => `<li><span>${esc(s.nome)}</span><span>${fmt.reais(s.preco)}</span></li>`).join('')}
          <li class="total"><span>Total</span><span>${fmt.reais(p.valor_total)}</span></li>
        </ul>
        ${p.observacao_cliente ? `<p class="suave" style="margin-top:1rem;white-space:pre-line">Recado: ${esc(p.observacao_cliente)}</p>` : ''}
        ${p.pode_alterar ? `
          <div class="acoes">
            <a class="botao secundario" href="#/agendar?remarcar=${esc(p.token)}">Remarcar</a>
            <button class="perigo" id="cancelar">Cancelar</button>
          </div>
          <div id="confirmar"></div>` : ''}
        ${!tipoAviso && botaoZap ? `<div style="margin-top:.75rem">${botaoZap}</div>` : ''}
      </div>
      ${p.retorno ? `
      <div class="cartao destaque">
        <h2>Que tal já deixar seu retorno marcado?</h2>
        <p>Para ${esc(servicosTexto(p).toLowerCase())}, o ideal é voltar por volta de <strong>${esc(fmt.partesDoDia(p.retorno.sugerido_para).longa)}</strong>.</p>
        <a class="botao botao-largo" href="#/agendar?retorno=${esc(p.token)}">Agendar meu retorno</a>
      </div>` : ''}
      ${p.pago || p.pode_pagar ? `
      <div class="cartao" id="pagamento">
        <h2>Pagamento</h2>
        ${p.pago ? `<p class="mensagem sucesso" style="margin:0">✔ Pagamento confirmado pela Lucy${p.forma_pagamento ? ` (${esc(FORMAS_TXT[p.forma_pagamento])})` : ''}. Obrigada!</p>` : `
          <p class="suave">Como você prefere pagar? Total: <strong>${fmt.reais(p.valor_total)}</strong></p>
          <div class="opcoes-pagamento" role="group" aria-label="Forma de pagamento">
            ${[['pix', 'Pix'], ['cartao', 'Cartão'], ['dinheiro', 'Dinheiro']].map(([v, t]) => `
              <button class="pequeno ${p.forma_pagamento === v ? '' : 'secundario'}" data-forma="${v}" aria-pressed="${p.forma_pagamento === v}">${t}</button>`).join('')}
          </div>
          <div id="area-pix">${p.forma_pagamento === 'pix'
            ? (p.pix_disponivel ? '<button class="botao-largo" id="ver-pix">Mostrar o QR code do Pix</button>'
              : '<p class="mensagem atencao">A chave Pix ainda não foi cadastrada. Você pode pagar no salão.</p>')
            : p.forma_pagamento ? '<p class="suave">Combinado! É só pagar no salão, no dia do atendimento.</p>' : ''}</div>
          <p class="mensagem erro" id="msg-pag" role="alert"></p>`}
      </div>` : ''}
      ${p.avaliacao ? `
      <div class="cartao">
        <h2>Sua avaliação</h2>
        <p class="estrelas" aria-label="${p.avaliacao.nota} de 5 estrelas">${'★'.repeat(p.avaliacao.nota)}${'☆'.repeat(5 - p.avaliacao.nota)}</p>
        ${p.avaliacao.comentario ? `<p>${esc(p.avaliacao.comentario)}</p>` : ''}
        <p class="suave" style="margin:0">Obrigada por avaliar! 💜</p>
      </div>` : p.pode_avaliar ? `
      <form class="cartao" id="form-avaliar" novalidate>
        <h2>Como foi o seu atendimento?</h2>
        <div class="escolher-estrelas" role="radiogroup" aria-label="Nota de 1 a 5 estrelas">
          ${[1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="false" data-nota="${n}" aria-label="${n} estrela${n > 1 ? 's' : ''}">☆</button>`).join('')}
        </div>
        <label for="comentario">Quer deixar um comentário? <span class="opcional">(opcional)</span></label>
        <textarea id="comentario" maxlength="600"></textarea>
        <p class="mensagem erro" id="msg-aval" role="alert"></p>
        <button type="submit" class="botao-largo">Enviar avaliação</button>
      </form>` : ''}
      <div class="cartao">
        <h2>Seu link pessoal</h2>
        <p class="suave">Guarde este link: é por ele que você vê, remarca ou cancela seu horário.
          Neste aparelho, ele também fica em "Meu horário", no topo da página.</p>
        <div class="link-pessoal">
          <input id="link" readonly value="${esc(link)}" aria-label="Seu link pessoal">
          <button class="secundario" id="copiar">Copiar</button>
        </div>
      </div>
      <a class="botao secundario botao-largo" href="#/agendar">Fazer outro pedido</a>`;

    // Pagamento: escolher a forma e, se for Pix, mostrar o QR code
    $app.querySelectorAll('[data-forma]').forEach((b) => {
      b.onclick = async () => {
        b.disabled = true;
        try {
          await api(`/api/publico/pedidos/${encodeURIComponent(p.token)}/pagamento`, { metodo: 'POST', corpo: { forma: b.dataset.forma } });
          await telaPedido(p.token, new URLSearchParams());
          document.getElementById('pagamento')?.scrollIntoView({ block: 'start' });
        } catch (e) { b.disabled = false; document.getElementById('msg-pag').textContent = e.message; }
      };
    });
    document.getElementById('ver-pix')?.addEventListener('click', async (ev) => {
      ev.target.disabled = true;
      try {
        const pix = await api(`/api/publico/pedidos/${encodeURIComponent(p.token)}/pix`);
        const zapComprovante = salao?.salao?.whatsapp ? zapCom(salao.salao.whatsapp,
          `Olá, Lucy! Aqui é ${p.primeiro_nome}. Fiz o Pix de ${fmt.reais(pix.valor)} do meu horário de ${quandoTexto(p)}.`) : null;
        document.getElementById('area-pix').innerHTML = `
          <div class="qr-pix">${QR.svg(pix.copia_e_cola, 'QR code do Pix')}</div>
          <p style="text-align:center;margin:.25rem 0 1rem"><strong>${fmt.reais(pix.valor)}</strong></p>
          <p class="suave">Abra o app do seu banco, escolha "Pix → Ler QR code" e aponte para a imagem.
            Se estiver no celular, use o <strong>Pix copia e cola</strong>:</p>
          <textarea class="copia-cola" readonly aria-label="Pix copia e cola">${esc(pix.copia_e_cola)}</textarea>

  // Mensagem rápida no topo do painel (some sozinha).

  let ultimoAviso = null;
  // "extra" é HTML montado pelo próprio painel (ex.: botão do WhatsApp).
  function avisar(mensagem, tipo = 'sucesso', extra = '') {

  function mostrarAviso() {
    const $a = document.getElementById('aviso');

    $a.innerHTML = `<div class="mensagem ${ultimoAviso.tipo}">${esc(ultimoAviso.mensagem)}${ultimoAviso.extra ?? ''}</div>`;
    $a.scrollIntoView({ block: 'nearest' });
    clearTimeout(avisar.t);
    avisar.t = setTimeout(() => { $a.innerHTML = ''; ultimoAviso = null; }, ultimoAviso.ate - Date.now());

  // Pergunta "Tem certeza?" numa janelinha da própria página. Devolve true ou false.
  function perguntar(textoHtml, { sim = 'Sim, excluir', nao = 'Não' } = {}) {
    return new Promise((resolver) => {
      const fundo = document.createElement('div');
      fundo.className = 'fundo-dialogo';
      fundo.innerHTML = `<div class="dialogo" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
        <p id="dlg-t">${textoHtml}</p>
        <div class="acoes"><button class="secundario" data-r="0">${esc(nao)}</button>
        <button class="perigo-cheio" data-r="1">${esc(sim)}</button></div></div>`;
      document.body.appendChild(fundo);
      const anterior = document.activeElement;
      const fechar = (r) => { fundo.remove(); anterior?.focus?.(); resolver(r); };
      fundo.querySelectorAll('button').forEach((b) => { b.onclick = () => fechar(b.dataset.r === '1'); });
      fundo.addEventListener('keydown', (e) => { if (e.key === 'Escape') fechar(false); });
      fundo.querySelector('[data-r="0"]').focus();
    });
  }

  const linkZapCliente = (a, tipo, extra) => a.cliente?.whatsapp ? zapCom(a.cliente.whatsapp, mensagemParaCliente(a, tipo, extra)) : null;

  // --- Formulários genéricos: desenha os campos e lê o que foi digitado.
  function htmlCampos(campos, valores = {}, prefixo = 'f') {
    return campos.map((c) => {
      const id = `${prefixo}-${c.nome}`;
      let v = valores[c.nome] ?? c.padrao ?? '';
      const dica = c.dica ? `<span class="dica">${c.dica}</span>` : '';
      if (c.tipo === 'check') {
        return `<label class="opcao"><input type="checkbox" id="${id}" name="${c.nome}" ${v ? 'checked' : ''}>
          <span class="info">${esc(c.rotulo)}${dica}</span></label>`;
      }
      let campo;
      if (c.tipo === 'area') {
        campo = `<textarea id="${id}" name="${c.nome}" maxlength="${c.max ?? 500}">${esc(v)}</textarea>`;
      } else if (c.tipo === 'select') {
        campo = `<select id="${id}" name="${c.nome}">${c.opcoes.map(([ov, ot]) =>
          `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(ot)}</option>`).join('')}</select>`;
      } else {
        const tipo = { numero: 'number', data: 'date', hora: 'time', tel: 'tel', email: 'email' }[c.tipo] ?? 'text';
        if (c.tipo === 'hora') v = String(v).slice(0, 5);
        if (c.tipo === 'tel' && v) v = zapBonito(v);  // 5511900000000 → (11) 90000-0000
        if (c.tipo === 'dinheiro' && v !== '') v = Number(v).toFixed(2).replace('.', ',');
        const extra = c.tipo === 'dinheiro' ? 'inputmode="decimal" placeholder="0,00"'
          : c.tipo === 'numero' ? `inputmode="numeric" min="${c.min ?? 0}" ${c.maxNum ? `max="${c.maxNum}"` : ''}`
          : c.tipo === 'tel' ? 'inputmode="tel" placeholder="(00) 00000-0000"' : `maxlength="${c.max ?? 200}"`;
        campo = `<input id="${id}" name="${c.nome}" type="${tipo}" ${extra} value="${esc(v)}">`;
      }
      return `<label for="${id}">${esc(c.rotulo)}${c.obrigatorio ? '' : ' <span class="opcional">(opcional)</span>'}${dica}</label>${campo}`;
    }).join('');
  }
  function lerCampos(form, campos) {
    const r = {};
    for (const c of campos) {
      const el = form.elements[c.nome];
      if (!el) continue;
      if (c.tipo === 'check') r[c.nome] = el.checked;
      else if (c.tipo === 'numero') r[c.nome] = el.value === '' ? null : Number(el.value);
      else r[c.nome] = el.value.trim();
    }
    return r;
  }

  // Envia um formulário e mostra o erro dentro dele, se houver.
  async function enviarFormulario(form, acao) {
    const $b = form.querySelector('button[type=submit]');
    const $msg = form.querySelector('.msg-form');
    const textoBotao = $b.textContent;
    $b.disabled = true; $b.textContent = 'Salvando…'; $msg.textContent = '';
    try { await acao(); } catch (e) {
      if (e.status === 401) throw e;
      $msg.textContent = e.message; $b.disabled = false; $b.textContent = textoBotao;
    }
  }

  // --- Tela de lista com CRUD (serve para serviços, promoções e dias especiais)
  async function gerenciarLista($c, op) {
    const $area = document.createElement('div');
    $area.className = 'secao';
    $c.appendChild($area);
    let itens = await painelApi(`/${op.rota}`);

    const desenhar = () => {
      $area.innerHTML = `
        <div class="linha-titulo"><h2>${op.titulo}</h2><button class="pequeno" data-novo>+ ${op.novo}</button></div>
        ${op.intro ?? ''}
        <div data-form></div>
        ${itens.length ? itens.map((it) => `
          <div class="cartao item" data-id="${esc(it.id)}">
            ${op.resumo(it)}
            <div class="acoes-item">
              ${op.extras ? op.extras(it) : ''}
              <button class="secundario pequeno" data-acao="editar">Editar</button>
              <button class="perigo pequeno" data-acao="excluir">Excluir</button>
            </div>
          </div>`).join('') : `<p class="suave">${op.vazio ?? 'Nada cadastrado ainda.'}</p>`}`;
      $area.querySelector('[data-novo]').onclick = () => abrirFormulario(null);
      $area.querySelectorAll('.item').forEach(($it) => {
        const item = itens.find((x) => x.id === $it.dataset.id);
        $it.querySelectorAll('[data-acao]').forEach((b) => {
          b.onclick = async () => {
            const acao = b.dataset.acao;
            if (acao === 'editar') return abrirFormulario(item);
            if (acao === 'excluir') {
              if (!await perguntar(`Excluir <strong>${esc(op.nomeDe(item))}</strong>? Não dá para desfazer.`)) return;
              const r = await painelApi(`/${op.rota}/${item.id}`, { metodo: 'DELETE' });
              avisar(r.mensagem || 'Excluído.');
              return recarregar();
            }
            if (op.acoesExtras?.[acao]) { await op.acoesExtras[acao](item); return recarregar(); }
          };
        });
      });
    };

    const recarregar = async () => { itens = await painelApi(`/${op.rota}`); desenhar(); };

    const abrirFormulario = (item) => {
      const $f = $area.querySelector('[data-form]');
      $f.innerHTML = `
        <form class="cartao form-cartao" novalidate>
          <h2>${item ? 'Editar' : op.novo}</h2>
          ${htmlCampos(op.campos, item ?? {}, op.rota)}
          <p class="mensagem erro msg-form" role="alert"></p>
          <div class="acoes"><button type="button" class="secundario" data-cancelar>Cancelar</button>
          <button type="submit">Salvar</button></div>
        </form>`;
      const form = $f.querySelector('form');
      form.querySelector('[data-cancelar]').onclick = () => { $f.innerHTML = ''; };
      form.onsubmit = (ev) => {
        ev.preventDefault();
        enviarFormulario(form, async () => {
          const dados = lerCampos(form, op.campos);
          await painelApi(item ? `/${op.rota}/${item.id}` : `/${op.rota}`, { metodo: item ? 'PATCH' : 'POST', corpo: dados });
          avisar(item ? 'Alterações salvas.' : 'Cadastrado!');
          salaoCache = null;
          await recarregar();
        });
      };
      form.scrollIntoView({ block: 'start' });
      form.querySelector('input, textarea, select')?.focus({ preventScroll: true });
    };

    desenhar();
  }

          ? `<p class="pago">✔ Pago${a.forma_pagamento ? ` · ${esc(FORMAS_TXT[a.forma_pagamento])}` : ''}
              <button class="secundario pequeno" data-acao="desfazer-pagamento">Desfazer</button></p>`
          : `<div class="linha-pagamento"><span class="suave">Pagamento${a.forma_pagamento ? ` (prefere ${esc(FORMAS_TXT[a.forma_pagamento])})` : ''}:</span>
              <button class="secundario pequeno" data-acao="pix">Pix (QR code)</button>
              <button class="secundario pequeno" data-acao="pago-cartao">Pago no cartão</button>
              <button class="secundario pequeno" data-acao="pago-dinheiro">Pago em dinheiro</button></div>`) : ''}
        ${comAcoes ? `<div class="acoes-item">
          ${botoes.map(([acao, rotulo, classe]) => `<button class="pequeno ${classe}" data-acao="${acao}">${rotulo}</button>`).join('')}
          ${linkZapCliente(a, a.status) ? `<a class="botao secundario pequeno" href="${esc(linkZapCliente(a, a.status))}" target="_blank" rel="noopener"
            title="Abre o WhatsApp com a mensagem pronta">${ICONE_ZAP} WhatsApp</a>` : ''}
          ${a.status === 'agendado' && dataNoFuso(a.inicio) === hojeNoSalao() && c.whatsapp
            ? '<button class="secundario pequeno" data-acao="atraso">Vou atrasar</button>' : ''}
          <button class="secundario pequeno" data-acao="editar">Editar</button>
          <button class="perigo pequeno" data-acao="excluir">Excluir</button>
        </div>
        <div data-form></div>` : ''}
      </div>`;
  }
  const STATUS = {
    solicitado: 'Aguardando você', agendado: 'Confirmado', recusado: 'Recusado',
    concluido: 'Concluído', cancelado: 'Cancelado', faltou: 'Faltou',
  };

  // Liga os botões dos cartões de agendamento. "depois" recarrega a tela.
  function ligarAgendamentos($raiz, lista, depois) {
    $raiz.querySelectorAll('.agendamento').forEach(($card) => {
      const a = lista.find((x) => x.id === $card.dataset.id);
      $card.querySelectorAll('[data-acao]').forEach((b) => {
        b.onclick = async () => {
          const acao = b.dataset.acao;
          if (acao === 'editar') return formularioAgendamento($card.querySelector('[data-form]'), a, depois);
          if (acao === 'atraso') {
            return janela(`Avisar ${esc(a.cliente?.nome)} do atraso`, `<p class="suave">Escolha quanto tempo. O WhatsApp abre com a mensagem pronta.</p>
              <div class="lista-links">${[10, 15, 20, 30, 45].map((m) => `<a class="botao secundario" target="_blank" rel="noopener"
                href="${esc(linkZapCliente(a, 'atraso', { minutos: m }))}">${m} minutos</a>`).join('')}</div>`);
          }
          if (acao === 'pix') return mostrarPixNoPainel(a, depois);
          if (acao === 'pago-cartao' || acao === 'pago-dinheiro') return registrarPagamento(a, acao.slice(5), depois, b);
          if (acao === 'desfazer-pagamento') {
            if (!await perguntar(`Desfazer o pagamento de <strong>${esc(a.cliente?.nome)}</strong>?`, { sim: 'Sim, desfazer' })) return;
            await painelApi(`/agendamentos/${a.id}/pagamento`, { metodo: 'POST', corpo: { pago: false } });
            avisar('Pagamento desfeito.');
            return depois();
          }
          if (acao === 'excluir') {
            if (!await perguntar(`Excluir de vez o horário de <strong>${esc(a.cliente?.nome)}</strong>?
              <br><span class="suave">Dica: para manter o histórico, prefira "Cancelar".</span>`)) return;
            await painelApi(`/agendamentos/${a.id}`, { metodo: 'DELETE' });
            avisar('Horário excluído.');
            return depois();
          }
          if (['recusar', 'cancelar'].includes(acao) &&
              !await perguntar(`${acao === 'recusar' ? 'Recusar o pedido' : 'Cancelar o horário'} de <strong>${esc(a.cliente?.nome)}</strong>?`,
                { sim: acao === 'recusar' ? 'Sim, recusar' : 'Sim, cancelar' })) return;
          b.disabled = true;
          try {
            const r = await painelApi(`/agendamentos/${a.id}/${acao}`, { metodo: 'POST' });
            // Depois da ação: botão para avisar a cliente pelo WhatsApp (mensagem pronta)
            const zap = linkZapCliente(r, r.status);
            let extra = (zap && ['confirmar', 'recusar', 'cancelar', 'concluir'].includes(acao)
              ? `<a class="botao pequeno" style="margin-top:.6rem;display:flex" href="${esc(zap)}" target="_blank" rel="noopener">${ICONE_ZAP} ${acao === 'concluir'
                ? `Agradecer ${esc(r.cliente?.nome?.split(' ')[0])} e pedir avaliação` : `Avisar ${esc(r.cliente?.nome?.split(' ')[0])} no WhatsApp`}</a>` : '');
            // Retorno: oferecer ao finalizar (ou só depois do pagamento, conforme a aba Salão)
            if (acao === 'concluir' && (cfgPainel?.retorno_momento !== 'apos_pagamento' || r.pago)) extra += await botaoRetorno(r);
            avisar({ confirmar: 'Horário confirmado!', recusar: 'Pedido recusado.', cancelar: 'Horário cancelado.',
              concluir: 'Atendimento concluído.', faltou: 'Marcado como falta.' }[acao], 'sucesso', extra);
            depois();
          } catch (e) { b.disabled = false; if (e.status === 401) throw e; avisar(e.message, 'erro'); }
        };
      });
    });
  }

  // Botão "Agendar retorno" (abre o formulário já com a cliente, os serviços e o dia sugerido)
  let servicosCache = null;
  async function botaoRetorno(a) {
    servicosCache ??= await painelApi('/servicos').catch(() => []);
    const dias = a.servicos.map((x) => servicosCache.find((s) => s.id === x.servico_id)?.retorno_dias).filter(Boolean);
    const dia = somarDias(hojeNoSalao(), dias.length ? Math.min(...dias) : 30);
    const q = new URLSearchParams({ dia, cliente: a.cliente?.id ?? '', servicos: a.servicos.map((x) => x.servico_id).filter(Boolean).join(','), retorno_de: a.id });
    return `<a class="botao secundario pequeno" style="margin-top:.5rem;display:flex" href="#/painel/agenda/novo?${q}">
      Agendar retorno de ${esc(a.cliente?.nome?.split(' ')[0])} (sugestão: ${esc(fmt.partesDoDia(dia).longa)})</a>`;
  }

  // Registra o pagamento; se a Lucy escolheu "oferecer retorno depois do pagamento", oferece aqui.
  async function registrarPagamento(a, forma, depois, botao) {
    if (botao) botao.disabled = true;
    try {
      const r = await painelApi(`/agendamentos/${a.id}/pagamento`, { metodo: 'POST', corpo: { forma, pago: true } });
      const extra = r.status === 'concluido' && cfgPainel?.retorno_momento === 'apos_pagamento' ? await botaoRetorno(r) : '';
      avisar(`Pagamento registrado (${FORMAS_TXT[forma]}).`, 'sucesso', extra);
      depois();
    } catch (e) { if (botao) botao.disabled = false; if (e.status === 401) throw e; avisar(e.message, 'erro'); }
  }

  // Mostra o QR code do Pix para a cliente escanear ali mesmo (ou mandar pelo WhatsApp)
  async function mostrarPixNoPainel(a, depois) {
    let pix;
    try { pix = await painelApi(`/agendamentos/${a.id}/pix`); } catch (e) {
      if (e.status === 401) throw e;
      return avisar(e.message, 'erro', ' <a href="#/painel/salao">Cadastrar a chave Pix</a>');
    }
    const zap = linkZapCliente(a, 'pix', { valor: pix.valor, copia: pix.copia_e_cola });
    const $j = janela(`Pix de ${esc(a.cliente?.nome)}`, `
      <div class="qr-pix">${QR.svg(pix.copia_e_cola, 'QR code do Pix')}</div>
      <p style="text-align:center;margin:.25rem 0 1rem"><strong>${fmt.reais(pix.valor)}</strong></p>
      <p class="suave">A cliente aponta a câmera do app do banco para o QR code. Ou mande o "copia e cola":</p>
      <textarea class="copia-cola" readonly aria-label="Pix copia e cola">${esc(pix.copia_e_cola)}</textarea>
      <div class="lista-links">
        <button class="secundario" data-copiar-pix>Copiar código Pix</button>
        ${zap ? `<a class="botao secundario" target="_blank" rel="noopener" href="${esc(zap)}">${ICONE_ZAP} Mandar o Pix pelo WhatsApp</a>` : ''}
        <button data-recebi>Já recebi o Pix (confirmar pagamento)</button>
      </div>
      <p class="suave" style="margin-top:0">Confira no app do seu banco se o Pix entrou antes de confirmar.</p>`);
    $j.querySelector('[data-copiar-pix]').onclick = async (e) => { e.target.textContent = await copiarTexto(pix.copia_e_cola) ? 'Copiado!' : 'Selecione e copie'; };
    $j.querySelector('[data-recebi]').onclick = async () => { $j.remove(); await registrarPagamento(a, 'pix', depois); };
  }

  // Formulário de agendamento: serve para MARCAR (novo) e para EDITAR.
  async function formularioAgendamento($onde, a, depois, padroes = {}) {
    const [servicos, clientes] = await Promise.all([
      painelApi('/servicos'),
      a ? Promise.resolve([]) : painelApi('/clientes'),
    ]);
    const escolhidos = new Set(a ? a.servicos.map((s) => s.servico_id) : (padroes.servicos ?? []));
    const visiveis = servicos.filter((s) => s.ativo || escolhidos.has(s.id));
    const data = a ? dataNoFuso(a.inicio) : (padroes.dia ?? hojeNoSalao());
    $onde.innerHTML = `
      <form class="cartao form-cartao" novalidate>
        <h2>${a ? 'Editar horário' : padroes.retorno_de ? 'Agendar retorno' : 'Marcar horário'}</h2>
        ${a ? `<p><strong>${esc(a.cliente?.nome)}</strong></p>` : `
          <label for="ag-cliente">Cliente</label>
          <select id="ag-cliente" name="cliente">
            <option value="">— escolha —</option>
            <option value="nova">+ Cliente nova</option>
            ${clientes.map((c) => `<option value="${esc(c.id)}" ${c.id === padroes.cliente ? 'selected' : ''}>${esc(c.nome)} · ${esc(zapBonito(c.whatsapp))}</option>`).join('')}
          </select>
          <div data-nova hidden>
            <label for="ag-nome">Nome da cliente nova</label><input id="ag-nome" name="nome" maxlength="80">
            <label for="ag-zap">WhatsApp</label><input id="ag-zap" name="whatsapp" type="tel" inputmode="tel" placeholder="(00) 00000-0000">
          </div>`}
        <fieldset style="border:0;padding:0;margin:1rem 0 0"><legend style="font-weight:600;margin-bottom:.35rem">Serviços</legend>
          ${visiveis.map((s) => `<label class="opcao"><input type="checkbox" name="servico" value="${esc(s.id)}" data-min="${s.duracao_min}"
            ${escolhidos.has(s.id) ? 'checked' : ''}><span class="info"><span class="nome">${esc(s.nome)}</span>
            <span class="suave">${fmt.duracao(s.duracao_min)}</span></span><strong>${fmt.reais(s.preco)}</strong></label>`).join('')}
        </fieldset>
        <div class="tres-colunas">
          <div><label for="ag-data">Dia</label><input id="ag-data" name="data" type="date" value="${esc(data)}"></div>
          <div><label for="ag-ini">Início</label><input id="ag-ini" name="inicio" type="time" value="${a ? esc(fmt.hora(a.inicio)) : esc(padroes.hora ?? '')}"></div>
          <div><label for="ag-fim">Término</label><input id="ag-fim" name="fim" type="time" value="${a ? esc(fmt.hora(a.fim)) : ''}"></div>
        </div>
        <p class="dica">O término é calculado pela soma dos serviços; você pode ajustar.</p>
        <label for="ag-obs">Recado / observação <span class="opcional">(opcional)</span></label>
        <textarea id="ag-obs" name="observacao" maxlength="500">${esc(a?.observacao_cliente ?? '')}</textarea>
        <p class="mensagem erro msg-form" role="alert"></p>
        <div class="acoes"><button type="button" class="secundario" data-cancelar>Cancelar</button><button type="submit">Salvar</button></div>
      </form>`;
    const form = $onde.querySelector('form');
    const $sel = form.elements.cliente;
    if ($sel) $sel.onchange = () => { form.querySelector('[data-nova]').hidden = $sel.value !== 'nova'; };
    // Término automático: início + soma das durações (até a Lucy mexer no término).
    let fimManual = !!a;
    const recalcular = () => {
      if (fimManual || !form.elements.inicio.value) return;
      const min = [...form.querySelectorAll('[name=servico]:checked')].reduce((t, x) => t + Number(x.dataset.min), 0);
      const [h, m] = form.elements.inicio.value.split(':').map(Number);
      const total = Math.min(h * 60 + m + (min || 60), 23 * 60 + 59);
      form.elements.fim.value = `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    };
    form.elements.fim.oninput = () => { fimManual = true; };
    form.elements.inicio.oninput = recalcular;
    form.querySelectorAll('[name=servico]').forEach((x) => { x.onchange = () => { if (!a) fimManual = false; recalcular(); }; });
    form.querySelector('[data-cancelar]').onclick = () => { $onde.innerHTML = ''; };
    form.onsubmit = (ev) => {
      ev.preventDefault();
      enviarFormulario(form, async () => {
        const servs = [...form.querySelectorAll('[name=servico]:checked')].map((x) => x.value);
        const dia = form.elements.data.value, ini = form.elements.inicio.value, fim = form.elements.fim.value;
        if (!servs.length) throw new ErroApi('Escolha pelo menos um serviço.', 400);
        if (!dia || !ini) throw new ErroApi('Informe o dia e a hora de início.', 400);
        const corpo = {
          servicos: servs, inicio: instanteDe(dia, ini), fim: fim ? instanteDe(dia, fim) : null,
          retorno_de: a ? undefined : padroes.retorno_de ?? null,
          observacao: form.elements.observacao.value.trim(),
        };
        if (a) {
          await painelApi(`/agendamentos/${a.id}`, { metodo: 'PATCH', corpo });
          avisar('Horário atualizado.');
        } else {
          if (!$sel.value) throw new ErroApi('Escolha a cliente (ou "Cliente nova").', 400);
          if ($sel.value === 'nova') corpo.cliente = { nome: form.elements.nome.value.trim(), whatsapp: form.elements.whatsapp.value.trim() };
          else corpo.cliente_id = $sel.value;
          await painelApi('/agendamentos', { metodo: 'POST', corpo });
          avisar('Horário marcado e confirmado!');
        }
        $onde.innerHTML = '';
        depois(dia);
      });
    };
    form.scrollIntoView({ block: 'start' });
  }

  // --- ABA: PEDIDOS (o que está esperando resposta)
  async function abaPedidos($c) {
    const hoje = hojeNoSalao(), amanha = somarDias(hoje, 1);
    const [pedidos, deHoje, deAmanha] = await Promise.all([
      painelApi('/agendamentos?status=solicitado'),
      painelApi(`/agendamentos?de=${hoje}&ate=${hoje}`),
      painelApi(`/agendamentos?de=${amanha}&ate=${amanha}`),
    ]);
    const lembrar = deAmanha.filter((a) => a.status === 'agendado');
    const confirmadosHoje = deHoje.filter((a) => a.status === 'agendado').length;
    $c.innerHTML = `
      <a class="cartao destaque resumo-hoje" href="#/painel/agenda">
        <span>Hoje: <strong>${confirmadosHoje}</strong> atendimento${confirmadosHoje === 1 ? '' : 's'} confirmado${confirmadosHoje === 1 ? '' : 's'}</span>
        <span>Ver agenda →</span></a>
      <h2>Pedidos esperando resposta ${pedidos.length ? `(${pedidos.length})` : ''}</h2>
      <div id="lista-pedidos">${pedidos.length ? pedidos.map((a) => cartaoAgendamento(a, { comData: true })).join('')
