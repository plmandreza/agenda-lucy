<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4ef"/>
      <stop offset="0.55" stop-color="#ffd1e3"/>
      <stop offset="1" stop-color="#f7c6dc"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a3b5c"/>
      <stop offset="1" stop-color="#b0507f"/>
    </linearGradient>
    <pattern id="bolinhas" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#ffffff" opacity=".55"/>
      <circle cx="23" cy="23" r="2.2" fill="#ffffff" opacity=".55"/>
    </pattern>
    <g id="brilho">
      <path d="M0 -14 C2 -4 4 -2 14 0 C4 2 2 4 0 14 C-2 4 -4 2 -14 0 C-4 -2 -2 -4 0 -14Z" fill="#fff"/>
    </g>
    <g id="coracao">
      <path d="M0 6 C-10 -2 -12 -10 -6 -13 C-2 -15 0 -12 0 -10 C0 -12 2 -15 6 -13 C12 -10 10 -2 0 6Z" fill="#ff7eb3"/>
    </g>
    <g id="laco">
      <path d="M0 0 C-14 -16 -40 -14 -38 2 C-36 16 -14 14 0 0Z" fill="#ff8fbf"/>
      <path d="M0 0 C14 -16 40 -14 38 2 C36 16 14 14 0 0Z" fill="#ff8fbf"/>
      <path d="M-4 2 L-16 28 L-6 24 L0 32 L2 6Z" fill="#f56fa8"/>
      <path d="M4 2 L16 28 L6 24 L0 32 L-2 6Z" fill="#f56fa8"/>
      <circle r="7" fill="#f56fa8"/>
      <path d="M-26 -2 C-22 -8 -14 -8 -10 -3" stroke="#fff" stroke-width="2.5" fill="none" opacity=".6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- fundo -->
  <rect width="1280" height="400" rx="36" fill="url(#fundo)"/>
  <rect width="1280" height="400" rx="36" fill="url(#bolinhas)"/>
  <rect x="14" y="14" width="1252" height="372" rx="26" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".9"/>

  <!-- nuvenzinhas -->
  <g fill="#fff" opacity=".75">
    <ellipse cx="150" cy="330" rx="70" ry="26"/><ellipse cx="200" cy="318" rx="46" ry="30"/><ellipse cx="110" cy="320" rx="36" ry="22"/>
    <ellipse cx="1150" cy="80" rx="64" ry="22"/><ellipse cx="1110" cy="70" rx="38" ry="24"/><ellipse cx="1190" cy="74" rx="34" ry="20"/>
  </g>

  <!-- brilhos e coraçõezinhos -->
  <use href="#brilho" transform="translate(92 86) scale(1.2)"/>
  <use href="#brilho" transform="translate(1060 330) scale(.9)"/>
  <use href="#brilho" transform="translate(760 60) scale(.7)"/>
  <use href="#brilho" transform="translate(300 360) scale(.6)"/>
  <use href="#coracao" transform="translate(180 120) scale(1.3) rotate(-12)"/>
  <use href="#coracao" transform="translate(1200 250) scale(1.1) rotate(14)"/>
  <use href="#coracao" transform="translate(690 350) scale(.9)"/>

  <!-- tesoura -->
  <g transform="translate(150 230) rotate(-30)">
    <path d="M0 0 L70 -8 L72 -2 Z" fill="#fff" stroke="#c9789f" stroke-width="2"/>
    <path d="M0 0 L70 8 L72 2 Z" fill="#fff" stroke="#c9789f" stroke-width="2"/>
    <circle cx="-16" cy="-12" r="13" fill="none" stroke="#e85d9b" stroke-width="7"/>
    <circle cx="-16" cy="12" r="13" fill="none" stroke="#e85d9b" stroke-width="7"/>
    <circle r="4" fill="#c9789f"/>
  </g>

  <!-- pente -->
  <g transform="translate(905 72) rotate(8) scale(.62)">
    <rect x="-60" y="-12" width="120" height="20" rx="10" fill="#ffffff" stroke="#e8a0c3" stroke-width="2"/>
    <g fill="#ffffff" stroke="#e8a0c3" stroke-width="2">
      <rect x="-54" y="4" width="7" height="28" rx="3.5"/><rect x="-40" y="4" width="7" height="28" rx="3.5"/>
      <rect x="-26" y="4" width="7" height="28" rx="3.5"/><rect x="-12" y="4" width="7" height="28" rx="3.5"/>
      <rect x="2" y="4" width="7" height="28" rx="3.5"/><rect x="16" y="4" width="7" height="28" rx="3.5"/>
      <rect x="30" y="4" width="7" height="28" rx="3.5"/><rect x="44" y="4" width="7" height="28" rx="3.5"/>
    </g>
  </g>

  <!-- título -->
  <use href="#laco" transform="translate(640 66) scale(1.15)"/>
  <text x="640" y="190" text-anchor="middle" font-family="Poppins, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="86" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round">Lucy Cabeleireira</text>
  <text x="640" y="190" text-anchor="middle" font-family="Poppins, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="86" fill="url(#titulo)">Lucy Cabeleireira</text>

  <!-- etiqueta -->
  <rect x="430" y="222" width="420" height="52" rx="26" fill="#fff" opacity=".9"/>
  <text x="640" y="256" text-anchor="middle" font-family="Poppins, 'Trebuchet MS', Arial, sans-serif" font-weight="600" font-size="25" fill="#b0507f">✿ agenda online do salão ✿</text>
  <text x="640" y="322" text-anchor="middle" font-family="Poppins, 'Trebuchet MS', Arial, sans-serif" font-style="italic" font-size="21" fill="#9a4a70">marque seu horário pelo celular e o Remy confere a agenda</text>

  <!-- Remy, o gato do salão: branquinho, orelhas rosadas, manchinhas cinza na cabeça, olhos azuis e rabo cinza -->
  <g transform="translate(1135 285)">
    <ellipse cx="0" cy="58" rx="62" ry="10" fill="#e9a9c8" opacity=".55"/>
    <!-- rabo cinza -->
    <path d="M44 40 C90 34 94 -8 70 -16" fill="none" stroke="#a7a3b0" stroke-width="15" stroke-linecap="round"/>
    <path d="M44 40 C90 34 94 -8 70 -16" fill="none" stroke="#8f8b99" stroke-width="15" stroke-linecap="round" stroke-dasharray="0 34 12 200"/>
    <!-- corpo branquinho -->
    <ellipse cx="0" cy="26" rx="54" ry="36" fill="#ffffff" stroke="#ead7e2" stroke-width="2.5"/>
    <ellipse cx="-22" cy="56" rx="13" ry="8" fill="#ffffff" stroke="#ead7e2" stroke-width="2.5"/>
    <ellipse cx="22" cy="56" rx="13" ry="8" fill="#ffffff" stroke="#ead7e2" stroke-width="2.5"/>
    <!-- orelhas grandes e rosadas -->
    <path d="M-48 -38 L-42 -92 L-10 -58 Z" fill="#ffffff" stroke="#ead7e2" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M48 -38 L42 -92 L10 -58 Z" fill="#ffffff" stroke="#ead7e2" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-40 -48 L-38 -80 L-18 -58 Z" fill="#ffadc9"/>
    <path d="M40 -48 L38 -80 L18 -58 Z" fill="#ffadc9"/>
    <!-- cabeça -->
    <ellipse cx="0" cy="-28" rx="52" ry="42" fill="#ffffff" stroke="#ead7e2" stroke-width="2.5"/>
    <!-- manchinhas cinza no alto da cabeça, perto das orelhas -->
    <path d="M-30 -62 C-22 -68 -12 -66 -10 -58 C-16 -54 -26 -54 -30 -62Z" fill="#a7a3b0" opacity=".85"/>
    <path d="M30 -62 C22 -68 12 -66 10 -58 C16 -54 26 -54 30 -62Z" fill="#a7a3b0" opacity=".85"/>
    <!-- olhos azuis -->
    <ellipse cx="-18" cy="-30" rx="9" ry="10" fill="#7fb0e6"/>
    <ellipse cx="18" cy="-30" rx="9" ry="10" fill="#7fb0e6"/>
    <ellipse cx="-17" cy="-29" rx="4.5" ry="6" fill="#2a2633"/>
    <ellipse cx="19" cy="-29" rx="4.5" ry="6" fill="#2a2633"/>
    <circle cx="-20" cy="-34" r="2.6" fill="#fff"/>
    <circle cx="16" cy="-34" r="2.6" fill="#fff"/>
    <ellipse cx="-34" cy="-12" rx="9" ry="5.5" fill="#ff9cc3" opacity=".7"/>
    <ellipse cx="34" cy="-12" rx="9" ry="5.5" fill="#ff9cc3" opacity=".7"/>
    <!-- pintinha cinza perto do focinho (no lado esquerdo dele = à direita de quem olha) -->
    <circle cx="10" cy="-18" r="2.4" fill="#7d7888"/>
    <!-- narizinho rosa e boquinha -->
    <path d="M-6 -16 L6 -16 L0 -9 Z" fill="#f59ab8"/>
    <path d="M0 -9 C-2 -3 -8 -2 -11 -5 M0 -9 C2 -3 8 -2 11 -5" fill="none" stroke="#b07a92" stroke-width="2.6" stroke-linecap="round"/>
    <!-- bigodes -->
    <g stroke="#d9cfd8" stroke-width="2.2" stroke-linecap="round">
      <path d="M-22 -12 L-52 -18"/><path d="M-22 -7 L-52 -4"/>
      <path d="M22 -12 L52 -18"/><path d="M22 -7 L52 -4"/>
    </g>
    <!-- lacinho no pescoço -->
    <use href="#laco" transform="translate(0 10) scale(.42)"/>
  </g>
  <text x="1135" y="372" text-anchor="middle" font-family="Poppins, 'Trebuchet MS', Arial, sans-serif" font-weight="600" font-size="15" fill="#9a4a70">Remy, secretário 🐾</text>
</svg>
